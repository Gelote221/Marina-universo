<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Marina ✨</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02030c;
  font-family:Georgia,serif;
  color:white;
}

#intro{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:
    radial-gradient(circle at 50% 45%,rgba(77,65,180,.22),transparent 32%),
    radial-gradient(circle at 20% 20%,rgba(255,214,100,.08),transparent 25%),
    #02030c;
  transition:opacity 1.4s ease,visibility 1.4s;
}

#intro h1{
  font-size:clamp(55px,18vw,110px);
  margin:0;
  font-weight:normal;
  letter-spacing:8px;
  text-shadow:
    0 0 10px rgba(255,255,255,.7),
    0 0 35px rgba(180,170,255,.8);
}

#intro p{
  margin:18px 25px 35px;
  font-size:16px;
  opacity:.75;
}

#enter{
  border:1px solid rgba(255,255,255,.45);
  background:rgba(255,255,255,.08);
  color:white;
  padding:15px 30px;
  border-radius:40px;
  font-size:17px;
  backdrop-filter:blur(10px);
  cursor:pointer;
}

#enter:active{
  transform:scale(.95);
}

#intro.hidden{
  opacity:0;
  visibility:hidden;
}

#scene{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#hint{
  position:fixed;
  z-index:5;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 40px);
  max-width:500px;
  text-align:center;
  padding:12px 18px;
  border-radius:30px;
  background:rgba(5,7,25,.42);
  border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(12px);
  font-size:13px;
  opacity:0;
  transition:opacity 1s;
  pointer-events:none;
}

#hint.show{
  opacity:.8;
}

#message{
  position:fixed;
  inset:0;
  z-index:15;
  display:none;
  justify-content:center;
  align-items:center;
  padding:25px;
  background:rgba(1,2,12,.72);
  backdrop-filter:blur(15px);
}

.messageBox{
  width:min(92%,520px);
  padding:35px 27px;
  border-radius:28px;
  background:
    radial-gradient(circle at top,rgba(255,231,110,.12),transparent 55%),
    rgba(12,15,38,.9);
  border:1px solid rgba(255,235,150,.3);
  box-shadow:
    0 0 70px rgba(255,220,80,.12),
    inset 0 0 40px rgba(255,255,255,.025);
  text-align:center;
  animation:appear .7s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:scale(.8) translateY(25px);
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

.messageFlower{
  font-size:60px;
  margin-bottom:15px;
  filter:drop-shadow(0 0 15px rgba(255,220,70,.8));
}

.messageBox p{
  font-size:17px;
  line-height:1.75;
  white-space:pre-line;
}

.closeMessage{
  margin-top:25px;
  padding:12px 28px;
  border-radius:30px;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08);
  color:white;
  font-size:15px;
}

#finalText{
  position:fixed;
  z-index:10;
  inset:0;
  pointer-events:none;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:50px;
  text-align:center;
}

#finalText div{
  padding:13px 22px;
  border-radius:30px;
  background:rgba(5,5,20,.55);
  backdrop-filter:blur(12px);
  font-size:14px;
  opacity:.85;
}

#love{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  background:
    radial-gradient(circle,rgba(255,218,75,.16),transparent 35%),
    #02030c;
  animation:loveAppear 2s ease;
}

@keyframes loveAppear{
  from{opacity:0}
  to{opacity:1}
}

#loveFlower{
  font-size:130px;
  filter:
    drop-shadow(0 0 15px #ffe45b)
    drop-shadow(0 0 50px rgba(255,218,60,.7));
  animation:flowerPulse 2.5s ease-in-out infinite;
}

@keyframes flowerPulse{
  0%,100%{transform:scale(1) rotate(-2deg)}
  50%{transform:scale(1.08) rotate(2deg)}
}

#love h2{
  font-size:clamp(45px,13vw,90px);
  letter-spacing:7px;
  font-weight:normal;
  margin:20px 0 0;
  text-shadow:0 0 30px rgba(170,220,255,.8);
}

#love p{
  opacity:.65;
  font-size:15px;
}
</style>
</head>

<body>

<div id="intro">
  <h1>Marina</h1>
  <p>Hay algo que quiero enseñarte...</p>
  <button id="enter">Entrar ✨</button>
</div>

<div id="scene"></div>

<div id="hint">
  Explora el universo... 🌌<br>
  <small>Mueve el dedo para mirar a tu alrededor</small>
</div>

<div id="message">
  <div class="messageBox">
    <div class="messageFlower">🌼</div>
    <p id="messageText"></p>
    <button class="closeMessage" id="closeMessage">Continuar explorando ✨</button>
  </div>
</div>

<div id="finalText">
  <div>Hay algo más... sigue avanzando hacia la luz 🌼</div>
</div>

<div id="love">
  <div id="loveFlower">🌼</div>
  <h2>TE AMO 🩵</h2>
  <p>Para ti, Marina.</p>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { ArcballControls } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/ArcballControls.js";

const sceneContainer = document.getElementById("scene");
const intro = document.getElementById("intro");
const enter = document.getElementById("enter");
const hint = document.getElementById("hint");
const message = document.getElementById("message");
const messageText = document.getElementById("messageText");
const closeMessage = document.getElementById("closeMessage");
const finalText = document.getElementById("finalText");
const love = document.getElementById("love");

let started = false;
let unlocked = 1;
let finalMode = false;
let finalProgress = 0;

const flowerMessages = [
`Se que quizá esto no es lo que te esperabas pero quería darte esto de una manera un poquito más especial y ya sabes, a mi estilo.`,

`Todo esto para recordarte de que los detalles típicos, se pueden modificar con un poquito más de esfuerzo para que tenga un toque un poco más personal y no sea tan básico como regalarte un ramo sin más.`,

`Aunque quizá no te gusta tanto la idea de tener una página web en la que puedas ir viendo todo, pero tienes algo que no se irá nunca y podrás visitarlo cada vez que quieras. Pero con todo este rollo voy a la parte bonita jajajja.`,

`Marina recio, sé que no es una fecha especial ni nada por el estilo pero es mi manera de demostrarte que no hay nada en el mundo que no quiera hacer por ti, ya que para mí, lo eres todo en este mundo. Y lo que siempre te digo y cosa que no quiero que transforme en algo típico sin sentimiento es que…`
];

const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(0x02030c,0.004);

const camera = new THREE.PerspectiveCamera(
65,
innerWidth / innerHeight,
0.1,
3000
);

camera.position.set(0,0,28);

const renderer = new THREE.WebGLRenderer({
antialias:true,
alpha:false,
powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

sceneContainer.appendChild(renderer.domElement);

/* LUCES */

const ambient = new THREE.AmbientLight(0x8899cc,.45);
scene.add(ambient);

const mainLight = new THREE.PointLight(0xffdf91,3,180);
mainLight.position.set(0,8,15);
scene.add(mainLight);

const blueLight = new THREE.PointLight(0x7899ff,2,160);
blueLight.position.set(-30,-10,-30);
scene.add(blueLight);

/* CONTROLES */

const controls = new ArcballControls(
camera,
renderer.domElement,
scene
);

controls.enableAnimations = true;
controls.enablePan = true;
controls.enableRotate = true;
controls.enableZoom = true;
controls.enableFocus = true;
controls.cursorZoom = true;
controls.minDistance = 5;
controls.maxDistance = 170;
controls.rotateSpeed = 1.2;
controls.scaleFactor = 1.12;
controls.setGizmosVisible(false);

/* ESTRELLAS */

const starGeometry = new THREE.BufferGeometry();
const starPositions = [];
const starSizes = [];

for(let i=0;i<3000;i++){

  const radius = 45 + Math.random()*210;
  const theta = Math.random()*Math.PI*2;
  const phi = Math.acos(2*Math.random()-1);

  const x = radius*Math.sin(phi)*Math.cos(theta);
  const y = radius*Math.sin(phi)*Math.sin(theta);
  const z = radius*Math.cos(phi);

  starPositions.push(x,y,z);
  starSizes.push(Math.random()*2+.4);
}

starGeometry.setAttribute(
"position",
new THREE.Float32BufferAttribute(starPositions,3)
);

const starMaterial = new THREE.PointsMaterial({
color:0xffffff,
size:.7,
transparent:true,
opacity:.9,
sizeAttenuation:true
});

const stars = new THREE.Points(starGeometry,starMaterial);
scene.add(stars);

/* ESTRELLAS DE COLORES */

function createStarField(color,count){

  const geometry = new THREE.BufferGeometry();
  const positions=[];

  for(let i=0;i<count;i++){

    const radius=60+Math.random()*170;
    const a=Math.random()*Math.PI*2;
    const b=Math.acos(2*Math.random()-1);

    positions.push(
      radius*Math.sin(b)*Math.cos(a),
      radius*Math.sin(b)*Math.sin(a),
      radius*Math.cos(b)
    );
  }

  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(positions,3)
  );

  const material=new THREE.PointsMaterial({
    color,
    size:1.2,
    transparent:true,
    opacity:.5
  });

  const points=new THREE.Points(geometry,material);
  scene.add(points);

  return points;
}

const blueStars=createStarField(0x8fb8ff,350);
const pinkStars=createStarField(0xffa8d8,250);
const goldStars=createStarField(0xffe6a0,180);

/* NEBULOSAS */

function createNebula(x,y,z,color,size){

  const group=new THREE.Group();

  for(let i=0;i<18;i++){

    const geometry=new THREE.SphereGeometry(
      size*(.5+Math.random()*.7),
      24,
      24
    );

    const material=new THREE.MeshBasicMaterial({
      color,
      transparent:true,
      opacity:.025+Math.random()*.025,
      depthWrite:false
    });

    const cloud=new THREE.Mesh(geometry,material);

    cloud.position.set(
      (Math.random()-.5)*size*2,
      (Math.random()-.5)*size*1.4,
      (Math.random()-.5)*size*2
    );

    group.add(cloud);
  }

  group.position.set(x,y,z);
  scene.add(group);

  return group;
}

const nebula1=createNebula(-45,20,-50,0x635cff,25);
const nebula2=createNebula(50,-20,-70,0xff55bb,30);
const nebula3=createNebula(0,45,-100,0x33aaff,35);
const nebula4=createNebula(-65,-35,-90,0xffd35a,22);

/* PLANETAS */

function createPlanet(x,y,z,radius,color,ring=false){

  const group=new THREE.Group();

  const geometry=new THREE.SphereGeometry(radius,40,40);

  const material=new THREE.MeshStandardMaterial({
    color,
    roughness:.75,
    metalness:.05
  });

  const planet=new THREE.Mesh(geometry,material);
  group.add(planet);

  /* atmósfera */

  const atmosphere=new THREE.Mesh(
    new THREE.SphereGeometry(radius*1.08,32,32),
    new THREE.MeshBasicMaterial({
      color:0x8fbfff,
      transparent:true,
      opacity:.07,
      side:THREE.BackSide
    })
  );

  group.add(atmosphere);

  if(ring){

    const ringGeometry=new THREE.RingGeometry(
      radius*1.45,
      radius*2.05,
      80
    );

    const ringMaterial=new THREE.MeshBasicMaterial({
      color:0xdcbf8b,
      transparent:true,
      opacity:.45,
      side:THREE.DoubleSide
    });

    const ringMesh=new THREE.Mesh(
      ringGeometry,
      ringMaterial
    );

    ringMesh.rotation.x=Math.PI/2.5;
    group.add(ringMesh);
  }

  group.position.set(x,y,z);

  scene.add(group);

  return group;
}

const planets=[
  createPlanet(-32,10,-38,7,0x5d78a8,true),
  createPlanet(30,15,-55,5,0xb36d58,false),
  createPlanet(38,-25,-35,9,0x6b587e,true),
  createPlanet(-45,-24,-60,4,0xc89d59,false),
  createPlanet(5,35,-80,11,0x506d82,true),
  createPlanet(65,5,-100,6,0x8875b7,false)
];

/* LUNAS */

function moon(x,y,z,radius,color){

  const mesh=new THREE.Mesh(
    new THREE.SphereGeometry(radius,24,24),
    new THREE.MeshStandardMaterial({
      color,
      roughness:1
    })
  );

  mesh.position.set(x,y,z);
  scene.add(mesh);

  return mesh;
}

moon(-23,8,-35,1.3,0xaaa9b5);
moon(26,18,-50,.9,0xc2c0bb);
moon(32,-19,-29,1.5,0xaaa5b8);
moon(-41,-21,-54,.7,0xb8b1a0);

/* FLORES 3D */

const flowerObjects=[];

function createFlower(number,x,y,z,scale=1){

  const group=new THREE.Group();

  group.position.set(x,y,z);
  group.scale.setScalar(scale);

  group.userData.number=number;

  /* tallo */

  const stem=new THREE.Mesh(
    new THREE.CylinderGeometry(.08,.13,2.8,12),
    new THREE.MeshStandardMaterial({
      color:0x416b46,
      roughness:.9
    })
  );

  stem.position.y=-1.35;
  group.add(stem);

  /* hojas */

  for(let side of [-1,1]){

    const leaf=new THREE.Mesh(
      new THREE.SphereGeometry(.35,16,16),
      new THREE.MeshStandardMaterial({
        color:0x527f50,
        roughness:.8
      })
    );

    leaf.scale.set(1.5,.25,.55);
    leaf.position.set(side*.35,-1.25,0);
    leaf.rotation.z=side*.35;

    group.add(leaf);
  }

  /* pétalos */

  for(let i=0;i<10;i++){

    const angle=(i/10)*Math.PI*2;

    const petal=new THREE.Mesh(
      new THREE.SphereGeometry(.72,24,24),
      new THREE.MeshStandardMaterial({
        color:0xffdf32,
        roughness:.65,
        emissive:0x4c3c00,
        emissiveIntensity:.2
      })
    );

    petal.scale.set(.62,1.45,.34);

    petal.position.set(
      Math.cos(angle)*.85,
      .05+Math.sin(angle)*.15,
      Math.sin(angle)*.85
    );

    petal.rotation.y=-angle;

    group.add(petal);
  }

  /* centro */

  const center=new THREE.Mesh(
    new THREE.SphereGeometry(.58,28,28),
    new THREE.MeshStandardMaterial({
      color:0xffa900,
      roughness:.5,
      emissive:0x5a3200,
      emissiveIntensity:.3
    })
  );

  center.position.y=.05;
  group.add(center);

  /* halo */

  const glow=new THREE.Mesh(
    new THREE.SphereGeometry(1.8,24,24),
    new THREE.MeshBasicMaterial({
      color:0xffdf32,
      transparent:true,
      opacity:.07,
      depthWrite:false
    })
  );

  glow.position.y=.05;
  group.add(glow);

  scene.add(group);

  flowerObjects.push(group);

  return group;
}

/*
  Las flores están MUY separadas.
  La idea es que tengas que explorar.
*/

const flowers=[
  createFlower(1,-18,5,-24,1.3),
  createFlower(2,24,-4,-48,1.25),
  createFlower(3,-34,-16,-62,1.4),
  createFlower(4,40,22,-82,1.45)
];

/* LUCES DE LAS FLORES */

flowers.forEach((flower,i)=>{

  const light=new THREE.PointLight(
    0xffd92e,
    .9,
    15
  );

  light.position.set(0,1,0);
  flower.add(light);

  flower.userData.light=light;

});

/* POLVO CÓSMICO */

const dustGeometry=new THREE.BufferGeometry();
const dustPositions=[];

for(let i=0;i<900;i++){

  const radius=20+Math.random()*100;
  const angle=Math.random()*Math.PI*2;

  dustPositions.push(
    Math.cos(angle)*radius,
    (Math.random()-.5)*80,
    Math.sin(angle)*radius
  );
}

dustGeometry.setAttribute(
"position",
new THREE.Float32BufferAttribute(dustPositions,3)
);

const dust=new THREE.Points(
dustGeometry,
new THREE.PointsMaterial({
  color:0xb6aaff,
  size:.35,
  transparent:true,
  opacity:.45
})
);

scene.add(dust);

/* INTERACCIÓN CON FLORES */

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

function checkFlower(clientX,clientY){

  if(message.style.display==="flex") return;
  if(finalMode) return;

  pointer.x=(clientX/innerWidth)*2-1;
  pointer.y=-(clientY/innerHeight)*2+1;

  raycaster.setFromCamera(pointer,camera);

  const hits=raycaster.intersectObjects(
    flowerObjects,
    true
  );

  if(!hits.length) return;

  let obj=hits[0].object;

  while(obj && !obj.userData.number){
    obj=obj.parent;
  }

  if(!obj) return;

  const number=obj.userData.number;

  if(number!==unlocked){

    hint.textContent=
      `Todavía no... primero tienes que encontrar la flor ${unlocked} 🌼`;

    hint.classList.add("show");

    setTimeout(()=>{
      hint.classList.remove("show");
    },2200);

    return;
  }

  openFlower(number);
}

renderer.domElement.addEventListener(
  "pointerup",
  e=>{
    checkFlower(e.clientX,e.clientY);
  }
);

/* MENSAJES */

function openFlower(number){

  messageText.textContent=flowerMessages[number-1];

  message.style.display="flex";

  flowerObjects[number-1].userData.found=true;

  flowerObjects[number-1].scale.multiplyScalar(1.18);

  if(number<4){
    unlocked=number+1;
  }else{
    setTimeout(()=>{
      finalMode=true;
      finalText.style.display="flex";
      hint.classList.remove("show");
    },900);
  }
}

closeMessage.addEventListener("click",()=>{

  message.style.display="none";

  if(unlocked<=4){

    hint.textContent=
      `La flor ${unlocked} sigue en algún lugar de este universo... 🌼`;

    hint.classList.add("show");

    setTimeout(()=>{
      hint.classList.remove("show");
    },3000);
  }
});

/* ENTRAR */

enter.addEventListener("click",()=>{

  started=true;

  intro.classList.add("hidden");

  setTimeout(()=>{
    hint.classList.add("show");

    setTimeout(()=>{
      hint.classList.remove("show");
    },4500);
  },900);

});

/* FINAL */

let finalStart=null;

function updateFinal(){

  if(!finalMode) return;

  /*
    Cuando el usuario se acerca mucho a la zona
    de la cuarta flor, empieza la secuencia final.
  */

  const distance=camera.position.distanceTo(
    flowers[3].position
  );

  if(distance<25){

    finalProgress+=.004;

    finalText.innerHTML=
      `<div>Acércate un poco más... 🌼</div>`;

  }

  if(distance<14){

    finalProgress+=.008;

    finalText.innerHTML=
      `<div>Ya casi... 🤍</div>`;

  }

  if(finalProgress>1.3){

    love.style.display="flex";
    finalMode=false;
  }
}

/* ANIMACIÓN */

const clock=new THREE.Clock();

function animate(){

  requestAnimationFrame(animate);

  const t=clock.getElapsedTime();

  /* movimiento de estrellas */

  stars.rotation.y=t*.002;
  blueStars.rotation.y=-t*.0015;
  pinkStars.rotation.y=t*.001;
  goldStars.rotation.y=-t*.0008;

  /* nebulosas */

  nebula1.rotation.y=t*.008;
  nebula2.rotation.y=-t*.006;
  nebula3.rotation.x=t*.005;
  nebula4.rotation.y=t*.007;

  /* planetas */

  planets.forEach((planet,i)=>{

    planet.rotation.y=t*(.03+i*.008);

    planet.position.y +=
      Math.sin(t*.2+i)*.0015;
  });

  /* flores */

  flowerObjects.forEach((flower,i)=>{

    flower.rotation.y=
      t*(.12+i*.025);

    flower.position.y +=
      Math.sin(t*.7+i)*.002;

    if(flower.userData.found){

      flower.userData.light.intensity=
        1.8+Math.sin(t*4)*.6;

    }else{

      flower.userData.light.intensity=
        .65+Math.sin(t*2+i)*.2;
    }
  });

  /* polvo */

  dust.rotation.y=t*.004;

  updateFinal();

  renderer.render(scene,camera);
}

animate();

/* RESIZE */

window.addEventListener("resize",()=>{

  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

});

/* MENSAJE INICIAL DE CONTROL */

setTimeout(()=>{

  if(!started) return;

  hint.innerHTML=
    `Explora libremente 🌌<br>
     <small>Arrastra para mirar · Pellizca para acercarte · Toca las flores</small>`;

},1000);

</script>

</body>
</html>
