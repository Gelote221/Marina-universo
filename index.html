<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Marina ✨</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#01010a;
    font-family:Georgia,"Times New Roman",serif;
    color:white;
    touch-action:none;
}

canvas{
    display:block;
}

/* INTRO */

#intro{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#01010a;
    transition:opacity 1.5s,transform 1.5s;
}

#intro.hide{
    opacity:0;
    transform:scale(1.7);
    pointer-events:none;
}

.intro-title{
    font-size:clamp(55px,18vw,110px);
    font-weight:normal;
    letter-spacing:10px;
    text-shadow:
        0 0 10px white,
        0 0 35px #a78cff,
        0 0 70px #694cff;
}

.intro-sub{
    margin-top:18px;
    font-size:13px;
    letter-spacing:4px;
    opacity:.65;
}

.intro-button{
    margin-top:45px;
    padding:14px 32px;
    border-radius:40px;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.08);
    color:white;
    font-family:Georgia,serif;
    font-size:15px;
}

/* HUD */

#hud{
    position:fixed;
    top:6%;
    left:0;
    width:100%;
    z-index:50;
    text-align:center;
    pointer-events:none;
    transition:opacity 1s;
}

#hud h1{
    font-size:clamp(40px,13vw,85px);
    font-weight:normal;
    letter-spacing:8px;
    text-shadow:
        0 0 10px white,
        0 0 30px #a78cff,
        0 0 60px #694cff;
}

#hud p{
    margin-top:8px;
    font-size:13px;
    letter-spacing:3px;
    opacity:.6;
}

#hint{
    position:fixed;
    bottom:5%;
    left:50%;
    transform:translateX(-50%);
    z-index:50;
    font-size:12px;
    letter-spacing:2px;
    opacity:.55;
    white-space:nowrap;
    pointer-events:none;
}

/* MENSAJES */

#message{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:rgba(2,1,14,.86);
    backdrop-filter:blur(18px);
}

#message.show{
    display:flex;
    animation:fadeIn .7s;
}

.message-box{
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    text-align:center;
    padding:30px 20px;
}

.fake-flower{
    width:90px;
    height:90px;
    margin:0 auto 35px;
    position:relative;
    filter:drop-shadow(0 0 22px #ffe66b);
    animation:flowerOpen 1.5s ease;
}

.fake-petal{
    position:absolute;
    width:30px;
    height:48px;
    left:30px;
    top:21px;
    border-radius:60% 60% 45% 45%;
    background:linear-gradient(135deg,#fffca0,#f0b21e);
    transform-origin:15px 24px;
    box-shadow:
        inset -5px -5px 10px rgba(120,70,0,.25),
        0 0 12px rgba(255,220,70,.5);
}

.fp1{transform:rotate(0deg) translateY(-20px)}
.fp2{transform:rotate(60deg) translateY(-20px)}
.fp3{transform:rotate(120deg) translateY(-20px)}
.fp4{transform:rotate(180deg) translateY(-20px)}
.fp5{transform:rotate(240deg) translateY(-20px)}
.fp6{transform:rotate(300deg) translateY(-20px)}

.fake-center{
    position:absolute;
    width:25px;
    height:25px;
    left:33px;
    top:33px;
    border-radius:50%;
    background:#d89416;
    box-shadow:0 0 20px #ffd84d;
}

#message h2{
    color:#ffe86b;
    font-size:28px;
    font-weight:normal;
    margin-bottom:25px;
    text-shadow:0 0 20px #d9a91d;
}

#message p{
    font-size:18px;
    line-height:1.75;
}

.close{
    margin-top:30px;
    padding:13px 28px;
    border-radius:30px;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.08);
    color:white;
    font-family:Georgia,serif;
}

/* AVISO */

#notice{
    position:fixed;
    bottom:13%;
    left:50%;
    transform:translate(-50%,20px);
    z-index:800;
    padding:12px 22px;
    border-radius:30px;
    background:rgba(10,7,35,.9);
    border:1px solid rgba(255,255,255,.2);
    opacity:0;
    transition:.4s;
    pointer-events:none;
    white-space:nowrap;
}

#notice.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* FINAL ZOOM */

#zoom{
    position:fixed;
    inset:0;
    z-index:700;
    display:none;
    overflow:hidden;
    background:
        radial-gradient(circle,#1d155e 0%,#080525 45%,#01010a 100%);
}

#zoom.show{
    display:block;
}

#zoomText{
    position:absolute;
    top:9%;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    text-align:center;
    font-size:14px;
    letter-spacing:2px;
    opacity:.65;
}

#finalFlower{
    position:absolute;
    width:150px;
    height:150px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.2);
    opacity:.1;
    transition:
        transform 2s ease,
        opacity 2s ease,
        filter 2s ease;
    filter:drop-shadow(0 0 5px #ffe66b);
}

#zoom.revealed #finalFlower{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
    filter:drop-shadow(0 0 55px #ffe66b);
}

.final-petal{
    position:absolute;
    width:48px;
    height:70px;
    left:51px;
    top:40px;
    border-radius:60%;
    background:linear-gradient(135deg,#ffffa0,#e6a817);
    transform-origin:24px 35px;
    box-shadow:
        inset -7px -8px 12px rgba(120,70,0,.25),
        0 0 20px rgba(255,220,70,.55);
}

.fnp1{transform:rotate(0deg) translateY(-34px)}
.fnp2{transform:rotate(60deg) translateY(-34px)}
.fnp3{transform:rotate(120deg) translateY(-34px)}
.fnp4{transform:rotate(180deg) translateY(-34px)}
.fnp5{transform:rotate(240deg) translateY(-34px)}
.fnp6{transform:rotate(300deg) translateY(-34px)}

.final-center{
    position:absolute;
    width:38px;
    height:38px;
    left:56px;
    top:56px;
    border-radius:50%;
    background:#dc9518;
    box-shadow:0 0 30px #ffd84d;
}

#love{
    position:absolute;
    top:72%;
    left:50%;
    transform:translate(-50%,-50%) scale(.3);
    opacity:0;
    font-size:clamp(40px,12vw,90px);
    white-space:nowrap;
    letter-spacing:7px;
    text-shadow:
        0 0 10px white,
        0 0 35px #8de5ff,
        0 0 70px #39baff;
    transition:2s;
}

#zoom.revealed #love{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

@keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
}

@keyframes flowerOpen{
    from{
        transform:scale(.3) rotate(-20deg);
        opacity:0;
    }
    to{
        transform:scale(1) rotate(0);
        opacity:1;
    }
}
</style>
</head>

<body>

<div id="intro">
    <div class="intro-title">Marina</div>
    <div class="intro-sub">un pequeño universo para ti</div>
    <button class="intro-button" onclick="enterUniverse()">
        Entrar ✨
    </button>
</div>

<div id="hud">
    <h1>Marina</h1>
    <p>encuentra las cuatro flores</p>
</div>

<div id="hint">
    Desliza para explorar el universo ✨
</div>

<div id="notice"></div>

<div id="message">
    <div class="message-box">

        <div class="fake-flower">
            <span class="fake-petal fp1"></span>
            <span class="fake-petal fp2"></span>
            <span class="fake-petal fp3"></span>
            <span class="fake-petal fp4"></span>
            <span class="fake-petal fp5"></span>
            <span class="fake-petal fp6"></span>
            <span class="fake-center"></span>
        </div>

        <h2 id="messageTitle"></h2>
        <p id="messageText"></p>

        <button class="close" onclick="closeMessage()">
            Volver al universo ✨
        </button>

    </div>
</div>

<div id="zoom">

    <div id="zoomText">
        Ahora acércate con dos dedos... 🤍
    </div>

    <div id="finalFlower">

        <span class="final-petal fnp1"></span>
        <span class="final-petal fnp2"></span>
        <span class="final-petal fnp3"></span>
        <span class="final-petal fnp4"></span>
        <span class="final-petal fnp5"></span>
        <span class="final-petal fnp6"></span>

        <span class="final-center"></span>

    </div>

    <div id="love">
        TE AMO 🩵
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =====================================
   ESCENA 3D
===================================== */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x01010a);

scene.fog=new THREE.FogExp2(
    0x080525,
    0.0018
);

const camera=new THREE.PerspectiveCamera(
    60,
    innerWidth/innerHeight,
    .1,
    2000
);

camera.position.set(0,0,20);

const renderer=new THREE.WebGLRenderer({
    antialias:true,
    alpha:true
});

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

document.body.insertBefore(
    renderer.domElement,
    document.body.firstChild
);


/* =====================================
   LUCES
===================================== */

const ambient=new THREE.AmbientLight(
    0xffffff,
    1.2
);

scene.add(ambient);

const light=new THREE.PointLight(
    0xffd85c,
    3,
    80
);

light.position.set(0,2,8);

scene.add(light);


/* =====================================
   ESTRELLAS 3D
===================================== */

const starGeometry=
    new THREE.BufferGeometry();

const starPositions=[];

for(let i=0;i<2200;i++){

    starPositions.push(
        (Math.random()-.5)*220,
        (Math.random()-.5)*150,
        (Math.random()-.5)*180
    );
}

starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        starPositions,
        3
    )
);

const starMaterial=
    new THREE.PointsMaterial({
        color:0xffffff,
        size:.18,
        transparent:true,
        opacity:.9
    });

const starField=
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(starField);


/* =====================================
   NEBULOSAS
===================================== */

function createNebula(color,x,y,z,size){

    const geometry=
        new THREE.SphereGeometry(size,32,32);

    const material=
        new THREE.MeshBasicMaterial({
            color:color,
            transparent:true,
            opacity:.08
        });

    const mesh=
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(x,y,z);

    scene.add(mesh);

    return mesh;
}

const nebula1=
    createNebula(
        0x6633ff,
        -30,
        10,
        -50,
        35
    );

const nebula2=
    createNebula(
        0xff4eae,
        30,
        -15,
        -70,
        40
    );


/* =====================================
   PLANETAS
===================================== */

function createPlanet(
    color,
    size,
    x,
    y,
    z
){

    const geometry=
        new THREE.SphereGeometry(
            size,
            40,
            40
        );

    const material=
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:.8,
            metalness:.1
        });

    const planet=
        new THREE.Mesh(
            geometry,
            material
        );

    planet.position.set(x,y,z);

    scene.add(planet);

    return planet;
}

const planet1=
    createPlanet(
        0x7647b8,
        2.5,
        -9,
        4,
        -12
    );

const planet2=
    createPlanet(
        0xc78648,
        1.5,
        9,
        2,
        -7
    );

const planet3=
    createPlanet(
        0x4267b5,
        3.2,
        11,
        -6,
        -18
    );


/* =====================================
   FLORES 3D
===================================== */

const flowers=[];

function createFlower(
    x,
    y,
    z,
    number
){

    const group=
        new THREE.Group();

    group.position.set(x,y,z);

    group.userData.number=number;
    group.userData.locked=
        number!==1;

    /* PÉTALOS */

    for(let i=0;i<6;i++){

        const geometry=
            new THREE.SphereGeometry(
                1,
                20,
                12
            );

        const material=
            new THREE.MeshStandardMaterial({
                color:0xffd52f,
                roughness:.45,
                metalness:.05,
                emissive:0x6b4500,
                emissiveIntensity:.35
            });

        const petal=
            new THREE.Mesh(
                geometry,
                material
            );

        const angle=
            i*Math.PI/3;

        petal.scale.set(
            .65,
            1.5,
            .25
        );

        petal.position.x=
            Math.cos(angle)*1.05;

        petal.position.y=
            Math.sin(angle)*1.05;

        petal.rotation.z=
            angle;

        group.add(petal);
    }

    /* CENTRO */

    const centerGeometry=
        new THREE.SphereGeometry(
            .65,
            30,
            30
        );

    const centerMaterial=
        new THREE.MeshStandardMaterial({
            color:0xd98d13,
            emissive:0xffb300,
            emissiveIntensity:.6
        });

    const center=
        new THREE.Mesh(
            centerGeometry,
            centerMaterial
        );

    center.position.z=.3;

    group.add(center);

    /* BRILLO */

    const glowGeometry=
        new THREE.SphereGeometry(
            2.4,
            20,
            20
        );

    const glowMaterial=
        new THREE.MeshBasicMaterial({
            color:0xffd93d,
            transparent:true,
            opacity:.08
        });

    const glow=
        new THREE.Mesh(
            glowGeometry,
            glowMaterial
        );

    group.add(glow);

    scene.add(group);

    flowers.push(group);

    return group;
}


/* POSICIONES */

createFlower(-7,2,2,1);
createFlower(7,0,-1,2);
createFlower(-5,-5,1,3);
createFlower(6,-5,-3,4);


/* =====================================
   CONTROL TÁCTIL
===================================== */

let targetRotationX=0;
let targetRotationY=0;

let startX=0;
let startY=0;

let dragging=false;

renderer.domElement.addEventListener(
    "touchstart",
    e=>{

        if(e.touches.length!==1) return;

        startX=e.touches[0].clientX;
        startY=e.touches[0].clientY;

        dragging=true;
    },
    {passive:false}
);

renderer.domElement.addEventListener(
    "touchmove",
    e=>{

        if(!dragging || e.touches.length!==1)
            return;

        const x=e.touches[0].clientX;
        const y=e.touches[0].clientY;

        const dx=x-startX;
        const dy=y-startY;

        targetRotationY+=dx*.0008;
        targetRotationX+=dy*.0005;

        startX=x;
        startY=y;

        e.preventDefault();
    },
    {passive:false}
);

renderer.domElement.addEventListener(
    "touchend",
    ()=>dragging=false
);


/* =====================================
   RATÓN
===================================== */

let mouseX=0;
let mouseY=0;

addEventListener(
    "mousemove",
    e=>{

        mouseX=
            (e.clientX/innerWidth-.5)*2;

        mouseY=
            (e.clientY/innerHeight-.5)*2;

    }
);


/* =====================================
   RAYCASTER
===================================== */

const raycaster=
    new THREE.Raycaster();

const pointer=
    new THREE.Vector2();


function checkFlower(clientX,clientY){

    pointer.x=
        (clientX/innerWidth)*2-1;

    pointer.y=
        -(clientY/innerHeight)*2+1;

    raycaster.setFromCamera(
        pointer,
        camera
    );

    const objects=[];

    flowers.forEach(
        flower=>{
            flower.traverse(
                obj=>{
                    if(obj.isMesh)
                        objects.push(obj);
                }
            );
        }
    );

    const hits=
        raycaster.intersectObjects(
            objects,
            false
        );

    if(hits.length===0)
        return;

    let object=
        hits[0].object;

    while(
        object.parent &&
        !object.userData.number
    ){

        object=object.parent;

    }

    if(!object.userData.number)
        return;

    openMessage(
        object.userData.number
    );
}


/* =====================================
   TOQUE
===================================== */

renderer.domElement.addEventListener(
    "click",
    e=>{
        checkFlower(
            e.clientX,
            e.clientY
        );
    }
);


/* =====================================
   MENSAJES
===================================== */

const messages={

1:{
title:"Flor 1",
text:"Se que quizá esto no es lo que te esperabas pero quería darte esto de una manera un poquito más especial y ya sabes, a mi estilo."
},

2:{
title:"Flor 2",
text:"Todo esto para recordarte de que los detalles típicos, se pueden modificar con un poquito más de esfuerzo para que tenga un toque un poco más personal y no sea tan básico como regalarte un ramo sin más."
},

3:{
title:"Flor 3",
text:"Aunque quizá no te gusta tanto la idea de tener una página web en la que puedas ir viendo todo, pero tienes algo que no se irá nunca y podrás visitarlo cada vez que quieras. Pero con todo este rollo voy a la parte bonita jajajja."
},

4:{
title:"Flor 4",
text:"Marina recio, sé que no es una fecha especial ni nada por el estilo pero es mi manera de demostrarte que no hay nada en el mundo que no quiera hacer por ti, ya que para mí, lo eres todo en este mundo. Y lo que siempre te digo y cosa que no quiero que transforme en algo típico sin sentimiento es que…"
}

};

let currentFlower=1;


/* =====================================
   ABRIR MENSAJE
===================================== */

function openMessage(number){

    if(number!==currentFlower){

        showNotice(
            "Busca primero la flor "+currentFlower+" 🌻"
        );

        return;
    }

    document.getElementById(
        "messageTitle"
    ).textContent=
        messages[number].title;

    document.getElementById(
        "messageText"
    ).textContent=
        messages[number].text;

    document.getElementById(
        "message"
    ).classList.add("show");

}


/* =====================================
   CERRAR MENSAJE
===================================== */

function closeMessage(){

    document.getElementById(
        "message"
    ).classList.remove("show");

    flowers[currentFlower-1]
        .userData.found=true;

    if(currentFlower<4){

        currentFlower++;

        flowers[currentFlower-1]
            .userData.locked=false;

        showNotice(
            "Hay otra flor esperándote... 🌻"
        );

    }else{

        setTimeout(
            startZoom,
            800
        );

    }

}


/* =====================================
   AVISO
===================================== */

function showNotice(text){

    const n=
        document.getElementById("notice");

    n.textContent=text;

    n.classList.add("show");

    setTimeout(
        ()=>n.classList.remove("show"),
        2200
    );

}


/* =====================================
   INTRO
===================================== */

function enterUniverse(){

    document.getElementById(
        "intro"
    ).classList.add("hide");

    setTimeout(
        ()=>{
            document.getElementById(
                "hint"
            ).style.opacity=".55";
        },
        1200
    );

}


/* =====================================
   ZOOM FINAL
===================================== */

let zoomLevel=1;
let startDistance=null;
let revealed=false;

const zoom=
    document.getElementById("zoom");


function startZoom(){

    zoom.classList.add("show");

}


/* PINCH */

zoom.addEventListener(
    "touchstart",
    e=>{

        if(e.touches.length===2){

            startDistance=
                distance(
                    e.touches[0],
                    e.touches[1]
                );

        }

    },
    {passive:false}
);


zoom.addEventListener(
    "touchmove",
    e=>{

        if(e.touches.length!==2)
            return;

        e.preventDefault();

        const d=
            distance(
                e.touches[0],
                e.touches[1]
            );

        if(startDistance===null){

            startDistance=d;
            return;

        }

        const change=
            d/startDistance;

        if(change>1)
            zoomLevel+=.025;

        zoomLevel=
            Math.min(
                4,
                Math.max(
                    1,
                    zoomLevel
                )
            );

        if(
            zoomLevel>=3 &&
            !revealed
        ){

            revealed=true;

            zoom.classList.add(
                "revealed"
            );

            document.getElementById(
                "zoomText"
            ).textContent=
                "Para ti, Marina 🩵";

        }

        startDistance=d;

    },
    {passive:false}
);


zoom.addEventListener(
    "touchend",
    ()=>{
        startDistance=null;
    }
);


function distance(a,b){

    const dx=
        a.clientX-b.clientX;

    const dy=
        a.clientY-b.clientY;

    return Math.sqrt(
        dx*dx+dy*dy
    );

}


/* =====================================
   ANIMACIÓN
===================================== */

let time=0;

function animate(){

    requestAnimationFrame(
        animate
    );

    time+=.005;

    /* universo */

    starField.rotation.y+=.00012;
    starField.rotation.x+=.00003;

    nebula1.rotation.y+=.0005;
    nebula2.rotation.y-=.0004;

    planet1.rotation.y+=.003;
    planet2.rotation.y+=.005;
    planet3.rotation.y+=.002;

    /* movimiento de cámara */

    camera.rotation.y+=
        (targetRotationY-camera.rotation.y)*.04;

    camera.rotation.x+=
        (targetRotationX-camera.rotation.x)*.04;

    camera.position.x+=
        (mouseX*1.2-camera.position.x)*.015;

    camera.position.y+=
        (-mouseY*0.8-camera.position.y)*.015;

    /* flores */

    flowers.forEach(
        (flower,i)=>{

            flower.rotation.y+=.006;

            flower.rotation.z=
                Math.sin(
                    time*2+i
                )*.08;

            flower.position.y+=
                Math.sin(
                    time*1.5+i
                )*.002;

            if(flower.userData.locked){

                flower.traverse(
                    obj=>{
                        if(
                            obj.material &&
                            obj.material.emissive
                        ){

                            obj.material.emissiveIntensity=.08;

                        }
                    }
                );

            }else{

                flower.traverse(
                    obj=>{
                        if(
                            obj.material &&
                            obj.material.emissive
                        ){

                            obj.material.emissiveIntensity=.4;

                        }
                    }
                );

            }

        }
    );

    renderer.render(
        scene,
        camera
    );

}

animate();


/* =====================================
   RESIZE
===================================== */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
