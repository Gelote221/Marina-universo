<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Marina ✨</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:white;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#intro{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at 50% 45%,rgba(55,35,110,.35),transparent 35%),
    radial-gradient(circle at 20% 20%,rgba(0,100,160,.2),transparent 30%),
    #01010a;
  transition:opacity 1.2s ease;
}

#intro h1{
  margin:0;
  font-size:clamp(60px,18vw,120px);
  font-weight:300;
  letter-spacing:8px;
  text-shadow:0 0 25px #fff,0 0 60px #a8b9ff;
}

#intro p{
  margin:15px 25px 35px;
  color:#d9d9ed;
  font-size:16px;
}

#enter{
  border:1px solid rgba(255,255,255,.55);
  color:white;
  background:rgba(255,255,255,.08);
  border-radius:50px;
  padding:15px 30px;
  font-size:17px;
  backdrop-filter:blur(10px);
}

#topText{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  text-align:center;
  pointer-events:none;
  color:rgba(255,255,255,.85);
  font-size:13px;
  letter-spacing:1px;
  text-shadow:0 0 12px #fff;
}

#message{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:rgba(0,0,10,.72);
  backdrop-filter:blur(12px);
}

.card{
  width:min(90vw,520px);
  max-height:80vh;
  overflow:auto;
  padding:30px 25px;
  border-radius:28px;
  text-align:center;
  background:linear-gradient(145deg,rgba(35,35,70,.9),rgba(8,8,25,.94));
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 0 50px rgba(140,150,255,.25);
}

.card h2{
  font-size:28px;
  font-weight:400;
  margin:0 0 20px;
}

.card p{
  font-size:17px;
  line-height:1.7;
  color:#eee;
}

.close{
  margin-top:20px;
  padding:12px 25px;
  border:1px solid rgba(255,255,255,.4);
  border-radius:30px;
  color:white;
  background:rgba(255,255,255,.08);
  font-size:15px;
}

#final{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#000;
  text-align:center;
}

#finalFlower{
  position:absolute;
  width:25px;
  height:25px;
  border-radius:50%;
  background:#ffd92f;
  box-shadow:
    0 0 15px #ffe95a,
    0 0 50px #ffd400,
    0 0 120px rgba(255,215,0,.8);
  transition:all 3s ease;
}

#finalText{
  opacity:0;
  transform:scale(.7);
  transition:all 2s ease;
  pointer-events:none;
}

#finalText h1{
  font-size:clamp(55px,15vw,110px);
  margin:0;
  font-weight:300;
  color:#fff;
  text-shadow:0 0 25px #fff,0 0 70px #8ccfff;
}

#finalText p{
  font-size:18px;
  color:#dcecff;
}

#hint{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:6;
  padding:10px 17px;
  border-radius:30px;
  background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.15);
  color:rgba(255,255,255,.75);
  font-size:12px;
  pointer-events:none;
  text-align:center;
}

#progress{
  position:fixed;
  top:50px;
  left:50%;
  transform:translateX(-50%);
  z-index:6;
  color:rgba(255,220,80,.9);
  font-size:12px;
  letter-spacing:2px;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="intro">
  <h1>Marina</h1>
  <p>He preparado un pequeño universo para ti...</p>
  <button id="enter">Entrar ✨</button>
</div>

<div id="topText"></div>
<div id="progress">FLORES DESCUBIERTAS: 0 / 4</div>
<div id="hint">Desliza para explorar · Pellizca para acercarte</div>

<canvas id="space"></canvas>

<div id="message">
  <div class="card">
    <h2 id="messageTitle"></h2>
    <p id="messageText"></p>
    <button class="close" id="closeMessage">Volver al universo ✨</button>
  </div>
</div>

<div id="final">
  <div id="finalFlower"></div>
  <div id="finalText">
    <h1>TE AMO 🩵</h1>
    <p>Y esto es solo una pequeña parte de todo lo que siento por ti.</p>
  </div>
</div>

<script>

const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){
  W = innerWidth;
  H = innerHeight;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  canvas.style.width = W+"px";
  canvas.style.height = H+"px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}

resize();
addEventListener("resize",resize);


/* =========================
   INTRO
========================= */

const intro = document.getElementById("intro");

document.getElementById("enter").onclick = () => {

  intro.style.opacity = "0";

  setTimeout(()=>{
    intro.style.display="none";
  },1200);

};


/* =========================
   UNIVERSO 3D
========================= */

let camera = {
  x:0,
  y:0,
  z:0
};

let rotationX = 0;
let rotationY = 0;

let targetRotationX = 0;
let targetRotationY = 0;

let zoom = 1;
let targetZoom = 1;

const stars = [];
const planets = [];
const dust = [];
const flowers = [];


/* ESTRELLAS */

for(let i=0;i<3500;i++){

  stars.push({
    x:(Math.random()-.5)*2200,
    y:(Math.random()-.5)*1400,
    z:Math.random()*1600+50,
    size:Math.random()*1.8+.2,
    alpha:Math.random()*.8+.2,
    twinkle:Math.random()*Math.PI*2
  });

}


/* POLVO CÓSMICO */

for(let i=0;i<900;i++){

  dust.push({
    x:(Math.random()-.5)*1100,
    y:(Math.random()-.5)*700,
    z:Math.random()*900+50,
    size:Math.random()*2+.3,
    hue:Math.random()*360
  });

}


/* PLANETAS */

function planet(x,y,z,r,color,ring=false){

  planets.push({
    x,y,z,r,color,ring,
    phase:Math.random()*Math.PI*2
  });

}

planet(-18,5,24,8,"#39266d",true);
planet(25,-12,55,12,"#1c496c",false);
planet(-35,-15,85,6,"#703b4e",true);
planet(45,20,115,15,"#493e83",true);
planet(-55,30,145,9,"#245d63",false);
planet(25,-35,180,18,"#653f2d",true);
planet(-70,-25,220,7,"#80513d",false);


/* LUNAS */

planet(-10,12,36,2,"#aaa8a0",false);
planet(17,-7,67,3,"#77736d",false);
planet(-28,-9,94,2.5,"#b7a88f",false);


/* FLORES */

function createFlower(x,y,z,index){

  flowers.push({
    x,y,z,
    index,
    unlocked:index===0,
    opened:false,
    size:3.2,
    phase:Math.random()*Math.PI*2
  });

}

createFlower(-18,7,48,0);
createFlower(27,-4,82,1);
createFlower(-36,-15,125,2);
createFlower(42,21,170,3);


/* =========================
   MENSAJES
========================= */

const messages = [

`Se que quizá esto no es lo que te esperabas pero quería darte esto de una manera un poquito más especial y ya sabes, a mi estilo.`,

`Todo esto para recordarte de que los detalles típicos, se pueden modificar con un poquito más de esfuerzo para que tenga un toque un poco más personal y no sea tan básico como regalarte un ramo sin más.`,

`Aunque quizá no te gusta tanto la idea de tener una página web en la que puedas ir viendo todo, pero tienes algo que no se irá nunca y podrás visitarlo cada vez que quieras. Pero con todo este rollo voy a la parte bonita jajajja.`,

`Marina recio, sé que no es una fecha especial ni nada por el estilo pero es mi manera de demostrarte que no hay nada en el mundo que no quiera hacer por ti, ya que para mí, lo eres todo en este mundo. Y lo que siempre te digo y cosa que no quiero que transforme en algo típico sin sentimiento es que…`
];


/* =========================
   PROYECCIÓN 3D
========================= */

function project(p){

  let x=p.x-camera.x;
  let y=p.y-camera.y;
  let z=p.z-camera.z;

  /* ROTACIÓN Y */

  let cosY=Math.cos(rotationY);
  let sinY=Math.sin(rotationY);

  let xx=x*cosY-z*sinY;
  let zz=x*sinY+z*cosY;

  /* ROTACIÓN X */

  let cosX=Math.cos(rotationX);
  let sinX=Math.sin(rotationX);

  let yy=y*cosX-zz*sinX;
  let zzz=y*sinX+zz*cosX;

  z=zzz;
  x=xx;
  y=yy;

  if(z<=5) return null;

  const focal=700*zoom;

  return {
    x:W/2+(x*focal/z),
    y:H/2+(y*focal/z),
    scale:focal/z,
    depth:z
  };

}


/* =========================
   DIBUJAR ESTRELLAS
========================= */

function drawStars(time){

  for(const s of stars){

    const p=project(s);

    if(!p) continue;

    if(p.x<-20 || p.x>W+20 || p.y<-20 || p.y>H+20)
      continue;

    const twinkle=.65+.35*Math.sin(time*.002+s.twinkle);

    ctx.globalAlpha=s.alpha*twinkle;

    ctx.fillStyle="#ffffff";

    const size=Math.max(.4,s.size*p.scale);

    ctx.beginPath();
    ctx.arc(p.x,p.y,size,0,Math.PI*2);
    ctx.fill();
  }

  ctx.globalAlpha=1;
}


/* =========================
   NEBULAS
========================= */

function drawNebula(){

  const clouds=[
    {x:-80,y:-40,z:100,r:130,c:"rgba(95,40,180,.08)"},
    {x:90,y:20,z:160,r:160,c:"rgba(0,120,190,.07)"},
    {x:-20,y:80,z:230,r:180,c:"rgba(200,50,120,.06)"}
  ];

  for(const n of clouds){

    const p=project(n);

    if(!p) continue;

    const r=n.r*p.scale;

    const g=ctx.createRadialGradient(
      p.x,p.y,0,
      p.x,p.y,r
    );

    g.addColorStop(0,n.c);
    g.addColorStop(1,"transparent");

    ctx.fillStyle=g;

    ctx.beginPath();
    ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fill();
  }
}


/* =========================
   PLANETAS
========================= */

function drawPlanet(pl,time){

  const p=project(pl);

  if(!p) return;

  const r=pl.r*p.scale;

  if(r<1) return;

  /* ANILLO */

  if(pl.ring){

    ctx.save();

    ctx.translate(p.x,p.y);
    ctx.rotate(-.25);

    ctx.strokeStyle="rgba(220,220,255,.45)";
    ctx.lineWidth=Math.max(1,r*.12);

    ctx.beginPath();
    ctx.ellipse(0,0,r*1.7,r*.45,0,0,Math.PI*2);
    ctx.stroke();

    ctx.restore();
  }

  const gradient=ctx.createRadialGradient(
    p.x-r*.35,
    p.y-r*.35,
    r*.1,
    p.x,
    p.y,
    r
  );

  gradient.addColorStop(0,"#ffffff");
  gradient.addColorStop(.08,pl.color);
  gradient.addColorStop(1,"#050509");

  ctx.fillStyle=gradient;

  ctx.beginPath();
  ctx.arc(p.x,p.y,r,0,Math.PI*2);
  ctx.fill();

  /* LUZ */

  ctx.shadowBlur=25;
  ctx.shadowColor=pl.color;

  ctx.strokeStyle="rgba(255,255,255,.08)";
  ctx.lineWidth=1;

  ctx.beginPath();
  ctx.arc(p.x,p.y,r,0,Math.PI*2);
  ctx.stroke();

  ctx.shadowBlur=0;
}


/* =========================
   FLORES 3D
========================= */

function drawFlower(f,time){

  const p=project(f);

  if(!p) return;

  const size=f.size*p.scale;

  if(size<2) return;

  const pulse=1+.08*Math.sin(time*.003+f.phase);

  const r=size*pulse;

  /* GLOW */

  const glow=ctx.createRadialGradient(
    p.x,p.y,0,
    p.x,p.y,r*4
  );

  glow.addColorStop(0,"rgba(255,235,60,.75)");
  glow.addColorStop(.35,"rgba(255,210,20,.22)");
  glow.addColorStop(1,"transparent");

  ctx.fillStyle=glow;

  ctx.beginPath();
  ctx.arc(p.x,p.y,r*4,0,Math.PI*2);
  ctx.fill();

  /* PÉTALOS */

  for(let i=0;i<8;i++){

    const a=(Math.PI*2/8)*i;

    const px=p.x+Math.cos(a)*r*.72;
    const py=p.y+Math.sin(a)*r*.72;

    const petal=ctx.createRadialGradient(
      px-r*.15,
      py-r*.15,
      1,
      px,
      py,
      r*.75
    );

    petal.addColorStop(0,"#fff58a");
    petal.addColorStop(.35,"#ffe32b");
    petal.addColorStop(1,"#dca800");

    ctx.fillStyle=petal;

    ctx.beginPath();
    ctx.ellipse(
      px,
      py,
      r*.55,
      r*.8,
      a,
      0,
      Math.PI*2
    );
    ctx.fill();
  }

  /* CENTRO */

  ctx.fillStyle="#8c5b00";
  ctx.beginPath();
  ctx.arc(p.x,p.y,r*.38,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#fff09b";
  ctx.beginPath();
  ctx.arc(p.x-r*.08,p.y-r*.08,r*.12,0,Math.PI*2);
  ctx.fill();

}


/* =========================
   PROFUNDIDAD / ORDEN
========================= */

function drawUniverse(time){

  ctx.clearRect(0,0,W,H);

  /* FONDO */

  const bg=ctx.createRadialGradient(
    W/2,H/2,0,
    W/2,H/2,Math.max(W,H)
  );

  bg.addColorStop(0,"#09051b");
  bg.addColorStop(.5,"#02020c");
  bg.addColorStop(1,"#000000");

  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  drawNebula();
  drawStars(time);

  const objects=[];

  for(const pl of planets){
    const p=project(pl);
    if(p) objects.push({type:"planet",obj:pl,depth:p.depth});
  }

  for(const f of flowers){
    const p=project(f);
    if(p) objects.push({type:"flower",obj:f,depth:p.depth});
  }

  objects.sort((a,b)=>b.depth-a.depth);

  for(const o of objects){

    if(o.type==="planet")
      drawPlanet(o.obj,time);

    else
      drawFlower(o.obj,time);

  }

}


/* =========================
   ANIMACIÓN
========================= */

let last=performance.now();

function animate(time){

  const dt=(time-last)/1000;
  last=time;

  rotationX += (targetRotationX-rotationX)*.08;
  rotationY += (targetRotationY-rotationY)*.08;

  zoom += (targetZoom-zoom)*.08;

  /* movimiento cósmico */

  for(const s of stars){
    s.twinkle+=dt;
  }

  drawUniverse(time);

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);


/* =========================
   CONTROL TÁCTIL
========================= */

let touching=false;
let lastX=0;
let lastY=0;

let pinchDistance=null;
let initialZoom=1;

canvas.addEventListener("touchstart",(e)=>{

  if(e.touches.length===1){

    touching=true;

    lastX=e.touches[0].clientX;
    lastY=e.touches[0].clientY;
  }

  if(e.touches.length===2){

    pinchDistance=getDistance(e.touches[0],e.touches[1]);
    initialZoom=targetZoom;
  }

},{passive:false});


canvas.addEventListener("touchmove",(e)=>{

  e.preventDefault();

  if(e.touches.length===1 && touching){

    const x=e.touches[0].clientX;
    const y=e.touches[0].clientY;

    const dx=x-lastX;
    const dy=y-lastY;

    targetRotationY += dx*.006;
    targetRotationX += dy*.006;

    targetRotationX=Math.max(-1.4,Math.min(1.4,targetRotationX));

    lastX=x;
    lastY=y;
  }

  if(e.touches.length===2){

    const d=getDistance(e.touches[0],e.touches[1]);

    if(pinchDistance){

      const ratio=d/pinchDistance;

      targetZoom=initialZoom*ratio;

      targetZoom=Math.max(.45,Math.min(2.8,targetZoom));
    }
  }

},{passive:false});


canvas.addEventListener("touchend",(e)=>{

  if(e.touches.length===0){

    touching=false;
    pinchDistance=null;
  }

});


function getDistance(a,b){

  return Math.hypot(
    a.clientX-b.clientX,
    a.clientY-b.clientY
  );

}


/* =========================
   RATÓN
========================= */

let mouseDown=false;

canvas.addEventListener("mousedown",(e)=>{

  mouseDown=true;
  lastX=e.clientX;
  lastY=e.clientY;

});

addEventListener("mouseup",()=>mouseDown=false);

canvas.addEventListener("mousemove",(e)=>{

  if(!mouseDown) return;

  const dx=e.clientX-lastX;
  const dy=e.clientY-lastY;

  targetRotationY+=dx*.006;
  targetRotationX+=dy*.006;

  targetRotationX=Math.max(-1.4,Math.min(1.4,targetRotationX));

  lastX=e.clientX;
  lastY=e.clientY;

});

canvas.addEventListener("wheel",(e)=>{

  e.preventDefault();

  targetZoom*=e.deltaY<0?1.1:.9;

  targetZoom=Math.max(.45,Math.min(2.8,targetZoom));

},{passive:false});


/* =========================
   DETECTAR FLORES
========================= */

let lastTap=0;

canvas.addEventListener("touchend",(e)=>{

  if(e.changedTouches.length!==1) return;

  const now=Date.now();

  if(now-lastTap<350) return;

  lastTap=now;

  const touch=e.changedTouches[0];

  checkFlower(
    touch.clientX,
    touch.clientY
  );

});


canvas.addEventListener("click",(e)=>{

  checkFlower(
    e.clientX,
    e.clientY
  );

});


function checkFlower(x,y){

  let closest=null;
  let closestDistance=Infinity;

  for(const f of flowers){

    if(!f.unlocked || f.opened)
      continue;

    const p=project(f);

    if(!p) continue;

    const distance=Math.hypot(
      x-p.x,
      y-p.y
    );

    const hit=Math.max(
      35,
      f.size*p.scale*2.5
    );

    if(distance<hit && distance<closestDistance){

      closest=f;
      closestDistance=distance;
    }
  }

  if(closest){

    openFlower(closest);
  }

}


/* =========================
   ABRIR FLORES
========================= */

function openFlower(f){

  f.opened=true;

  document.getElementById("messageTitle").textContent=
    "🌼 Flor "+(f.index+1);

  document.getElementById("messageText").textContent=
    messages[f.index];

  document.getElementById("message").style.display="flex";

  updateProgress();

}


/* =========================
   CERRAR MENSAJE
========================= */

document.getElementById("closeMessage").onclick=()=>{

  document.getElementById("message").style.display="none";

  const next=flowers.find(
    f=>!f.opened
  );

  if(next){

    next.unlocked=true;

    updateProgress();

    /* orientar ligeramente hacia la siguiente flor */

    camera.x*=.96;
    camera.y*=.96;
  }

  else{

    startFinal();
  }

};


/* =========================
   PROGRESO
========================= */

function updateProgress(){

  const count=flowers.filter(
    f=>f.opened
  ).length;

  document.getElementById("progress").textContent=
    "FLORES DESCUBIERTAS: "+count+" / 4";

}


/* =========================
   FINAL
========================= */

function startFinal(){

  document.getElementById("hint").textContent=
    "Ahora acércate a la luz...";

  /* Oscurecer progresivamente */

  setTimeout(()=>{

    document.getElementById("final").style.display="flex";

    const flower=
      document.getElementById("finalFlower");

    flower.style.left="50%";
    flower.style.top="50%";
    flower.style.transform="translate(-50%,-50%)";

    setTimeout(()=>{

      flower.style.width="180px";
      flower.style.height="180px";
      flower.style.transform=
        "translate(-50%,-50%) scale(1.5)";

      setTimeout(()=>{

        document.getElementById("finalText").style.opacity="1";
        document.getElementById("finalText").style.transform="scale(1)";

        flower.style.opacity="0";

      },2200);

    },1000);

  },700);

}


/* =========================
   DOBLE TOQUE FINAL
========================= */

let finalTouches=0;

document.getElementById("final").addEventListener(
  "touchstart",
  ()=>{
    finalTouches++;
  }
);


/* =========================
   ORIENTACIÓN INICIAL
========================= */

targetRotationX=.05;
targetRotationY=.0;
targetZoom=1;


/* =========================
   PEQUEÑO MOVIMIENTO DEL UNIVERSO
========================= */

setInterval(()=>{

  if(
    document.getElementById("message").style.display!=="flex" &&
    document.getElementById("final").style.display!=="flex"
  ){

    targetRotationY+=.0008;
  }

},30);

</script>

</body>
</html>
