<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marina</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#050014;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

#intro{
    text-align:center;
}

h1{
    font-size:80px;
    font-weight:300;
    margin:0 0 20px;
    text-shadow:0 0 30px #fff;
}

p{
    opacity:.8;
}

button{
    margin-top:25px;
    padding:16px 30px;
    border-radius:40px;
    border:1px solid white;
    background:rgba(255,255,255,.1);
    color:white;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="intro">
    <h1>Marina</h1>
    <p>He preparado un pequeño universo para ti...</p>

    <button id="entrar">Entrar ✨</button>
</div>

<script>
document.getElementById("entrar").addEventListener("click", function(){

    document.getElementById("intro").innerHTML = `
        <h1>✨ Bienvenida ✨</h1>
        <p>Ahora sí has entrado.</p>
    `;

});
</script>

</body>
</html>
