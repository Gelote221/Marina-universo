<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Marina 🩵</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:white;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#intro{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:

    radial-gradient(circle at 20% 20%,rgba(0,130,200,.2),transparent 30%),
    #02020b;
  transition:opacity 1.2s ease;
}

#intro h1{
  margin:0;
  font-size:clamp(65px,18vw,120px);
  font-weight:300;
  letter-spacing:7px;
  text-shadow:
    0 0 15px white,
    0 0 45px #aabfff,
    0 0 90px #6d55ff;
}

#intro p{
  margin:15px 25px 30px;
  color:#dcd9ee;
  font-size:16px;
}

#enter{
  padding:15px 30px;
  border-radius:50px;
  border:1px solid rgba(255,255,255,.6);
  background:rgba(255,255,255,.08);
  color:white;
  font-size:17px;
}

#hud{
  position:fixed;
  top:18px;
  left:0;
  right:0;
  z-index:10;
  text-align:center;
  pointer-events:none;
  text-shadow:0 0 12px white;
}

#progress{
  font-size:11px;
  letter-spacing:2px;
  color:#ffe34d;
}

#instruction{
  margin-top:7px;
  font-size:12px;
  color:rgba(255,255,255,.65);
}

#message{
  position:fixed;
  inset:0;
  z-index:60;
  display:none;
  justify-content:center;
  align-items:center;
  padding:25px;
  background:rgba(0,0,15,.72);
  backdrop-filter:blur(12px);
}

.card{
  width:min(90vw,520px);
  max-height:80vh;
  overflow:auto;
  padding:30px 24px;
  border-radius:28px;
  text-align:center;
  background:
    linear-gradient(
      145deg,
      rgba(40,35,75,.96),
      rgba(7,7,25,.97)
    );
  border:1px solid rgba(255,255,255,.25);
  box-shadow:
    0 0 50px rgba(130,140,255,.25);
}

.card h2{
  margin:0 0 20px;
  font-size:27px;
  font-weight:400;
}

.card p{
  margin:0;
  font-size:17px;
  line-height:1.75;
  color:#eeeeF8;
}

.close{
  margin-top:25px;
  padding:12px 23px;
  border-radius:30px;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.08);
  color:white;
  font-size:15px;
}

#final{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:#000;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
}

#finalUniverse{
  position:absolute;
  inset:0;
}

#finalFlower{
  position:absolute;
  left:50%;
  top:50%;
  width:30px;
  height:30px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:#ffe42e;
  box-shadow:
    0 0 20px #fff18a,
    0 0 60px #ffd000,
    0 0 130px rgba(255,210,0,.8);
  transition:
    width 4s ease,
    height 4s ease,
    opacity 2s ease;
}

#finalWords{
  position:relative;
  z-index:2;
  opacity:0;
  transform:scale(.7);
  transition:all 2.5s ease;
}

#finalWords h1{
  margin:0;
  font-size:clamp(55px,16vw,110px);
  font-weight:300;
  text-shadow:
    0 0 20px white,
    0 0 60px #8bd3ff,
    0 0 100px #398cff;
}

#finalWords p{
  color:#dceeff;
  font-size:17px;
  padding:0 25px;
}

#finalHint{
  position:absolute;
  bottom:30px;
  z-index:3;
  color:rgba(255,255,255,.7);
  font-size:13px;
}

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div id="intro">
  <h1>Marina</h1>
  <p>He preparado un pequeño universo para ti...</p>
  <button id="enter">Entrar ✨</button>
</div>

<div id="hud">
  <div id="progress">FLORES DESCUBIERTAS: 0 / 4</div>
  <div id="instruction">Desliza para explorar · Pellizca para acercarte</div>
</div>

<canvas id="canvas"></canvas>

<div id="message">
  <div class="card">
    <h2 id="messageTitle"></h2>
    <p id="messageText"></p>
    <button class="close" id="closeMessage">
      Volver al universo ✨
    </button>
  </div>
</div>

<div id="final">

  <canvas id="finalUniverse"></canvas>

  <div id="finalFlower"></div>

  <div id="finalWords">
    <h1>TE AMO 🩵</h1>
    <p>
      Y esto es solo una pequeña parte de todo lo que siento por ti.
    </p>
  </div>

  <div id="finalHint">
    Acércate a la luz ✨
  </div>

</div>

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width = innerWidth;
let height = innerHeight;

function resize(){

  width = innerWidth;
  height = innerHeight;

  canvas.width = width * devicePixelRatio;
  canvas.height = height * devicePixelRatio;

  canvas.style.width = width+"px";
  canvas.style.height = height+"px";

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );
}

resize();

addEventListener("resize",resize);


/* =========================================================
   INTRO
========================================================= */

document.getElementById("enter").onclick = function(){

  const intro = document.getElementById("intro");

  intro.style.opacity="0";

  setTimeout(function(){

    intro.style.display="none";

  },1200);
};


/* =========================================================
   MENSAJES
========================================================= */

const messages = [

`Se que quizá esto no es lo que te esperabas pero quería darte esto de una manera un poquito más especial y ya sabes, a mi estilo.`,

`Todo esto para recordarte de que los detalles típicos, se pueden modificar con un poquito más de esfuerzo para que tenga un toque un poco más personal y no sea tan básico como regalarte un ramo sin más.`,

`Aunque quizá no te gusta tanto la idea de tener una página web en la que puedas ir viendo todo, pero tienes algo que no se irá nunca y podrás visitarlo cada vez que quieras. Pero con todo este rollo voy a la parte bonita jajajja.`,

`Marina recio, sé que no es una fecha especial ni nada por el estilo pero es mi manera de demostrarte que no hay nada en el mundo que no quiera hacer por ti, ya que para mí, lo eres todo en este mundo. Y lo que siempre te digo y cosa que no quiero que transforme en algo típico sin sentimiento es que…`

];


/* =========================================================
   CÁMARA DEL UNIVERSO
========================================================= */

let cameraX = 0;
let cameraY = 0;
let cameraZ = 0;

let rotationX = 0;
let rotationY = 0;

let targetRotationX = 0;
let targetRotationY = 0;

let zoom = 1;
let targetZoom = 1;


/* =========================================================
   ESTRELLAS
========================================================= */

const stars=[];

for(let i=0;i<4200;i++){

  stars.push({

    x:(Math.random()-.5)*2200,
    y:(Math.random()-.5)*1500,
    z:Math.random()*1600+20,

    size:Math.random()*1.7+.2,

    brightness:Math.random()*.8+.2,

    phase:Math.random()*Math.PI*2

  });

}


/* =========================================================
   PARTÍCULAS
========================================================= */

const particles=[];

for(let i=0;i<900;i++){

  particles.push({

    x:(Math.random()-.5)*1500,
    y:(Math.random()-.5)*1000,
    z:Math.random()*1200+30,

    size:Math.random()*2+.2,

    color:[
      "rgba(120,170,255,.5)",
      "rgba(255,120,220,.4)",
      "rgba(170,120,255,.4)",
      "rgba(100,240,255,.4)"
    ][Math.floor(Math.random()*4)]

  });

}


/* =========================================================
   PLANETAS
========================================================= */

const planets=[];

function addPlanet(
  x,
  y,
  z,
  radius,
  color,
  ring=false
){

  planets.push({

    x,
    y,
    z,

    radius,

    color,

    ring,

    phase:Math.random()*Math.PI*2

  });

}

addPlanet(-100,-30,220,65,"#30206d",true);
addPlanet(160,70,360,95,"#1e506d",false);
addPlanet(-210,120,520,55,"#7a4055",true);
addPlanet(280,-110,700,120,"#493f87",true);
addPlanet(-350,-180,900,80,"#235f61",false);
addPlanet(170,220,1100,145,"#70432d",true);
addPlanet(-430,80,1350,65,"#754c39",false);

addPlanet(-40,-60,300,18,"#aaa79e",false);
addPlanet(205,90,395,22,"#77736d",false);
addPlanet(-235,145,550,16,"#c1b18f",false);


/* =========================================================
   NEBULOSAS
========================================================= */

const nebulas=[

  {
    x:-180,
    y:-80,
    z:400,
    radius:230,
    color:[120,50,220]
  },

  {
    x:230,
    y:100,
    z:650,
    radius:270,
    color:[0,130,220]
  },

  {
    x:-100,
    y:180,
    z:1000,
    radius:330,
    color:[220,50,130]
  }

];


/* =========================================================
   FLORES
========================================================= */

const flowers=[

  {
    x:-45,
    y:20,
    z:180,
    number:1,
    unlocked:true,
    opened:false,
    phase:Math.random()*10
  },

  {
    x:85,
    y:-45,
    z:420,
    number:2,
    unlocked:false,
    opened:false,
    phase:Math.random()*10
  },

  {
    x:-120,
    y:-65,
    z:700,
    number:3,
    unlocked:false,
    opened:false,
    phase:Math.random()*10
  },

  {
    x:135,
    y:80,
    z:1050,
    number:4,
    unlocked:false,
    opened:false,
    phase:Math.random()*10
  }

];


/* =========================================================
   PROYECCIÓN 3D
========================================================= */

function project(object){

  let x=object.x-cameraX;
  let y=object.y-cameraY;
  let z=object.z-cameraZ;


  /* ROTACIÓN HORIZONTAL */

  const cy=Math.cos(rotationY);
  const sy=Math.sin(rotationY);

  const rotatedX=x*cy-z*sy;
  const rotatedZ=x*sy+z*cy;

  x=rotatedX;
  z=rotatedZ;


  /* ROTACIÓN VERTICAL */

  const cx=Math.cos(rotationX);
  const sx=Math.sin(rotationX);

  const rotatedY=y*cx-z*sx;
  const rotatedDepth=y*sx+z*cx;

  y=rotatedY;
  z=rotatedDepth;


  if(z<=10)
    return null;


  const focal=850*zoom;

  return {

    x:width/2+(x*focal/z),

    y:height/2+(y*focal/z),

    scale:focal/z,

    depth:z

  };

}


/* =========================================================
   DIBUJAR NEBULOSAS
========================================================= */

function drawNebulas(){

  for(const n of nebulas){

    const p=project(n);

    if(!p)
      continue;

    const radius=n.radius*p.scale;

    if(radius<3)
      continue;

    const gradient=ctx.createRadialGradient(
      p.x,
      p.y,
      0,
      p.x,
      p.y,
      radius
    );

    gradient.addColorStop(
      0,
      `rgba(${n.color[0]},${n.color[1]},${n.color[2]},.16)`
    );

    gradient.addColorStop(
      .35,
      `rgba(${n.color[0]},${n.color[1]},${n.color[2]},.07)`
    );

    gradient.addColorStop(
      1,
      "transparent"
    );

    ctx.fillStyle=gradient;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      radius,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* =========================================================
   ESTRELLAS
========================================================= */

function drawStars(time){

  for(const s of stars){

    const p=project(s);

    if(!p)
      continue;

    if(
      p.x<-30 ||
      p.x>width+30 ||
      p.y<-30 ||
      p.y>height+30
    )
      continue;

    const pulse=
      .65+
      Math.sin(
        time*.002+s.phase
      )*.35;

    const size=
      Math.max(
        .3,
        s.size*p.scale
      );

    ctx.globalAlpha=
      s.brightness*pulse;

    ctx.fillStyle="#ffffff";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.globalAlpha=1;

}


/* =========================================================
   PARTÍCULAS
========================================================= */

function drawParticles(){

  for(const d of particles){

    const p=project(d);

    if(!p)
      continue;

    const size=
      Math.max(
        .4,
        d.size*p.scale
      );

    ctx.fillStyle=d.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* =========================================================
   PLANETAS
========================================================= */

function drawPlanet(planet,time){

  const p=project(planet);

  if(!p)
    return;

  const radius=
    planet.radius*p.scale;

  if(radius<1)
    return;


  /* ANILLOS */

  if(planet.ring){

    ctx.save();

    ctx.translate(
      p.x,
      p.y
    );

    ctx.rotate(-.25);

    ctx.strokeStyle=
      "rgba(210,220,255,.45)";

    ctx.lineWidth=
      Math.max(
        1,
        radius*.08
      );

    ctx.beginPath();

    ctx.ellipse(
      0,
      0,
      radius*1.8,
      radius*.5,
      0,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.restore();

  }


  /* SUPERFICIE */

  const gradient=
    ctx.createRadialGradient(
      p.x-radius*.35,
      p.y-radius*.35,
      radius*.05,
      p.x,
      p.y,
      radius
    );

  gradient.addColorStop(
    0,
    "#ffffff"
  );

  gradient.addColorStop(
    .08,
    planet.color
  );

  gradient.addColorStop(
    .7,
    planet.color
  );

  gradient.addColorStop(
    1,
    "#03030a"
  );

  ctx.fillStyle=gradient;

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    radius,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* BRILLO */

  ctx.shadowBlur=25;

  ctx.shadowColor=planet.color;

  ctx.strokeStyle=
    "rgba(255,255,255,.08)";

  ctx.lineWidth=1;

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    radius,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.shadowBlur=0;

}


/* =========================================================
   FLORES
========================================================= */

function drawFlower(f,time){

  const p=project(f);

  if(!p)
    return;

  const baseSize=
    17*p.scale;

  if(baseSize<2)
    return;

  const pulse=
    1+
    Math.sin(
      time*.003+f.phase
    )*.08;

  const r=
    baseSize*pulse;


  /* GLOW */

  const glow=
    ctx.createRadialGradient(
      p.x,
      p.y,
      0,
      p.x,
      p.y,
      r*5
    );

  glow.addColorStop(
    0,
    "rgba(255,240,80,.8)"
  );

  glow.addColorStop(
    .25,
    "rgba(255,215,20,.25)"
  );

  glow.addColorStop(
    1,
    "transparent"
  );

  ctx.fillStyle=glow;

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    r*5,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* PÉTALOS */

  for(let i=0;i<8;i++){

    const angle=
      i*Math.PI/4;

    const px=
      p.x+
      Math.cos(angle)*r*.7;

    const py=
      p.y+
      Math.sin(angle)*r*.7;

    const petal=
      ctx.createRadialGradient(
        px-r*.2,
        py-r*.2,
        1,
        px,
        py,
        r
      );

    petal.addColorStop(
      0,
      "#fff8a5"
    );

    petal.addColorStop(
      .35,
      "#ffe52e"
    );

    petal.addColorStop(
      1,
      "#d79d00"
    );

    ctx.fillStyle=petal;

    ctx.beginPath();

    ctx.ellipse(
      px,
      py,
      r*.5,
      r*.8,
      angle,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  /* CENTRO */

  ctx.fillStyle="#8b5d00";

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    r*.38,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* DESTELLO */

  ctx.fillStyle="#fff4a0";

  ctx.beginPath();

  ctx.arc(
    p.x-r*.1,
    p.y-r*.1,
    r*.11,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* NÚMERO */

  if(r>7){

    ctx.fillStyle="#fff";

    ctx.font=
      `bold ${Math.max(9,r*.65)}px Arial`;

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.shadowBlur=8;
    ctx.shadowColor="#000";

    ctx.fillText(
      f.number,
      p.x,
      p.y
    );

    ctx.shadowBlur=0;

  }

}


/* =========================================================
   DIBUJAR TODO
========================================================= */

function draw(time){

  /* FONDO */

  const background=
    ctx.createRadialGradient(
      width/2,
      height/2,
      0,
      width/2,
      height/2,
      Math.max(width,height)
    );

  background.addColorStop(
    0,
    "#0a061c"
  );

  background.addColorStop(
    .45,
    "#03030d"
  );

  background.addColorStop(
    1,
    "#000000"
  );

  ctx.fillStyle=background;

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  drawNebulas();

  drawStars(time);

  drawParticles();


  /* ORDENAR OBJETOS POR PROFUNDIDAD */

  const objects=[];

  for(const p of planets){

    const projected=project(p);

    if(projected){

      objects.push({
        type:"planet",
        object:p,
        depth:projected.depth
      });

    }

  }

  for(const f of flowers){

    const projected=project(f);

    if(projected){

      objects.push({
        type:"flower",
        object:f,
        depth:projected.depth
      });

    }

  }


  objects.sort(
    (a,b)=>b.depth-a.depth
  );


  for(const object of objects){

    if(object.type==="planet"){

      drawPlanet(
        object.object,
        time
      );

    }else{

      drawFlower(
        object.object,
        time
      );

    }

  }

}


/* =========================================================
   ANIMACIÓN
========================================================= */

function animation(time){

  rotationX +=
    (targetRotationX-rotationX)*.08;

  rotationY +=
    (targetRotationY-rotationY)*.08;

  zoom +=
    (targetZoom-zoom)*.08;


  draw(time);

  requestAnimationFrame(animation);

}

requestAnimationFrame(animation);


/* =========================================================
   MOVIMIENTO TÁCTIL
========================================================= */

let touching=false;

let startX=0;
let startY=0;

let lastX=0;
let lastY=0;

let moved=false;

let pinchStartDistance=null;
let pinchStartZoom=1;


canvas.addEventListener(
  "touchstart",
  function(e){

    if(e.touches.length===1){

      touching=true;

      moved=false;

      startX=
        e.touches[0].clientX;

      startY=
        e.touches[0].clientY;

      lastX=startX;
      lastY=startY;

    }


    if(e.touches.length===2){

      pinchStartDistance=
        distance(
          e.touches[0],
          e.touches[1]
        );

      pinchStartZoom=
        targetZoom;

    }

  },
  {passive:false}
);


canvas.addEventListener(
  "touchmove",
  function(e){

    e.preventDefault();


    /* UN DEDO */

    if(
      e.touches.length===1 &&
      touching
    ){

      const x=
        e.touches[0].clientX;

      const y=
        e.touches[0].clientY;

      const dx=
        x-lastX;

      const dy=
        y-lastY;


      if(
        Math.abs(x-startX)>8 ||
        Math.abs(y-startY)>8
      ){

        moved=true;

      }


      targetRotationY+=
        dx*.006;

      targetRotationX+=
        dy*.006;


      targetRotationX=
        Math.max(
          -1.35,
          Math.min(
            1.35,
            targetRotationX
          )
        );


      lastX=x;
      lastY=y;

    }


    /* DOS DEDOS = ZOOM */

    if(e.touches.length===2){

      const currentDistance=
        distance(
          e.touches[0],
          e.touches[1]
        );

      if(pinchStartDistance){

        const ratio=
          currentDistance/
          pinchStartDistance;

        targetZoom=
          pinchStartZoom*ratio;

        targetZoom=
          Math.max(
            .35,
            Math.min(
              3.2,
              targetZoom
            )
          );

      }

    }

  },
  {passive:false}
);


canvas.addEventListener(
  "touchend",
  function(e){

    if(e.touches.length===0){

      touching=false;

      pinchStartDistance=null;

    }

  }
);


function distance(a,b){

  return Math.hypot(
    a.clientX-b.clientX,
    a.clientY-b.clientY
  );

}


/* =========================================================
   RATÓN / ORDENADOR
========================================================= */

let mouseDown=false;

canvas.addEventListener(
  "mousedown",
  function(e){

    mouseDown=true;

    lastX=e.clientX;
    lastY=e.clientY;

    moved=false;

  }
);

addEventListener(
  "mouseup",
  function(){

    mouseDown=false;

  }
);


canvas.addEventListener(
  "mousemove",
  function(e){

    if(!mouseDown)
      return;

    const dx=
      e.clientX-lastX;

    const dy=
      e.clientY-lastY;

    if(
      Math.abs(dx)>2 ||
      Math.abs(dy)>2
    ){

      moved=true;

    }

    targetRotationY+=
      dx*.006;

    targetRotationX+=
      dy*.006;

    targetRotationX=
      Math.max(
        -1.35,
        Math.min(
          1.35,
          targetRotationX
        )
      );

    lastX=e.clientX;
    lastY=e.clientY;

  }
);


canvas.addEventListener(
  "wheel",
  function(e){

    e.preventDefault();

    targetZoom*=
      e.deltaY<0
      ?1.1
      :.9;

    targetZoom=
      Math.max(
        .35,
        Math.min(
          3.2,
          targetZoom
        )
      );

  },
  {passive:false}
);


/* =========================================================
   FLORES
========================================================= */

let lastTap=0;

function checkFlower(x,y){

  let selected=null;

  let bestDistance=Infinity;


  for(const f of flowers){

    if(!f.unlocked)
      continue;

    if(f.opened)
      continue;


    const p=project(f);

    if(!p)
      continue;


    const distanceFromFlower=
      Math.hypot(
        x-p.x,
        y-p.y
      );


    const hitRadius=
      Math.max(
        30,
        20*p.scale
      );


    if(
      distanceFromFlower<hitRadius &&
      distanceFromFlower<bestDistance
    ){

      selected=f;

      bestDistance=
        distanceFromFlower;

    }

  }


  if(selected){

    openFlower(selected);

  }

}


/* TOUCH */

canvas.addEventListener(
  "touchend",
  function(e){

    if(
      e.changedTouches.length!==1 ||
      moved
    )
      return;


    const now=Date.now();


    if(now-lastTap<400)
      return;


    lastTap=now;


    const touch=
      e.changedTouches[0];


    checkFlower(
      touch.clientX,
      touch.clientY
    );

  }
);


/* RATÓN */

canvas.addEventListener(
  "click",
  function(e){

    if(moved)
      return;

    checkFlower(
      e.clientX,
      e.clientY
    );

  }
);


/* =========================================================
   ABRIR FLOR
========================================================= */

function openFlower(f){

  f.opened=true;

  document.getElementById(
    "messageTitle"
  ).textContent=
    "🌼 Flor "+f.number;

  document.getElementById(
    "messageText"
  ).textContent=
    messages[f.number-1];

  document.getElementById(
    "message"
  ).style.display="flex";


  updateProgress();

}


/* =========================================================
   PROGRESO Y DESBLOQUEO
========================================================= */

function updateProgress(){

  const discovered=
    flowers.filter(
      f=>f.opened
    ).length;


  document.getElementById(
    "progress"
  ).textContent=
    "FLORES DESCUBIERTAS: "+
    discovered+
    " / 4";

}


/* =========================================================
   CERRAR MENSAJE
========================================================= */

document.getElementById(
  "closeMessage"
).onclick=function(){

  document.getElementById(
    "message"
  ).style.display="none";


  const next=
    flowers.find(
      f=>!f.opened
    );


  if(next){

    next.unlocked=true;

    document.getElementById(
      "instruction"
    ).textContent=
      "Hay otra flor esperándote... 🌼";

  }else{

    startFinal();

  }

};


/* =========================================================
   FINAL
========================================================= */

function startFinal(){

  document.getElementById(
    "instruction"
  ).textContent=
    "Ahora acércate a la luz...";


  const final=
    document.getElementById("final");

  final.style.display="flex";


  setTimeout(function(){

    document.getElementById(
      "finalFlower"
    ).style.width="150px";

    document.getElementById(
      "finalFlower"
    ).style.height="150px";


    setTimeout(function(){

      document.getElementById(
        "finalHint"
      ).textContent=
        "✨";


      setTimeout(function(){

        document.getElementById(
          "finalFlower"
        ).style.opacity="0";


        document.getElementById(
          "finalWords"
        ).style.opacity="1";


        document.getElementById(
          "finalWords"
        ).style.transform=
          "scale(1)";


      },1800);

    },2500);

  },1200);

}


/* =========================================================
   MOVIMIENTO SUAVE DEL UNIVERSO
========================================================= */

setInterval(
  function(){

    if(
      document.getElementById(
        "message"
      ).style.display!=="flex" &&
      document.getElementById(
        "final"
      ).style.display!=="flex"
    ){

      targetRotationY+=.0007;

    }

  },
  30
);

</script>
