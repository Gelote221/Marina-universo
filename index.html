<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Marina</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02030b;
  font-family:Arial,sans-serif;
  color:white;
  touch-action:none;
}

#intro{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at 50% 45%,#17164b 0%,#07071d 35%,#02030b 75%);
  transition:opacity 1.2s ease;
}

#intro h1{
  font-size:clamp(55px,16vw,110px);
  margin:0 0 10px;
  font-weight:300;
  letter-spacing:8px;
  text-shadow:0 0 35px #fff,0 0 80px #8e8cff;
}

#intro p{
  max-width:330px;
  padding:0 20px;
  line-height:1.6;
  opacity:.8;
}

#enter{
  margin-top:25px;
  padding:15px 30px;
  border:1px solid rgba(255,255,255,.4);
  border-radius:40px;
  background:rgba(255,255,255,.08);
  color:white;
  font-size:17px;
}

#game{
  position:fixed;
  inset:0;
  display:none;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

#hint{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  z-index:5;
  padding:9px 16px;
  border-radius:30px;
  background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.15);
  color:rgba(255,255,255,.72);
  font-size:12px;
  text-align:center;
  pointer-events:none;
  transition:opacity 2s;
}

#message{
  position:fixed;
  inset:0;
  z-index:15;
  display:none;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:rgba(1,2,12,.72);
  backdrop-filter:blur(8px);
}

.messageBox{
  max-width:500px;
  padding:32px 27px;
  border-radius:25px;
  background:rgba(10,10,35,.88);
  border:1px solid rgba(255,220,70,.35);
  box-shadow:0 0 50px rgba(255,215,60,.12);
  text-align:center;
  line-height:1.65;
  animation:appear .6s ease;
}

.messageBox p{
  margin:0;
  font-size:18px;
}

.close{
  margin-top:25px;
  padding:11px 24px;
  border:1px solid rgba(255,255,255,.3);
  border-radius:30px;
  background:rgba(255,255,255,.08);
  color:white;
  font-size:15px;
}

#final{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#000;
  overflow:hidden;
}

#finalFlower{
  width:42px;
  height:42px;
  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #fffbd0 0%,
      #ffe96a 30%,
      #ffd92e 65%,
      #e9ad00 100%
    );

  box-shadow:
    0 0 18px #ffe85b,
    0 0 45px rgba(255,220,50,.7),
    0 0 90px rgba(255,210,30,.35);

  transform:scale(.08);
  will-change:transform,opacity;
}

#love{
  margin-top:35px;
  font-size:clamp(40px,11vw,85px);
  letter-spacing:5px;
  opacity:0;
  text-shadow:0 0 25px #fff,0 0 70px #8edcff;
  transition:opacity 2s;
}

@keyframes appear{
  from{
    opacity:0;
    transform:scale(.92)
  }
  to{
    opacity:1;
    transform:scale(1)
  }
}
</style>
</head>

<body>

<div id="intro">
  <h1>Marina</h1>

  <p>
    He preparado un pequeño universo para ti.<br>
    Entra y explóralo.
  </p>

  <button id="enter">Entrar ✨</button>
</div>

<div id="game">
  <canvas id="canvas"></canvas>

  <div id="hint">
    Desliza suavemente para mirar alrededor · pellizca para avanzar
  </div>
</div>

<div id="message">
  <div class="messageBox">
    <p id="messageText"></p>

    <button class="close" id="closeMessage">
      Continuar ✨
    </button>
  </div>
</div>

<div id="final">
  <div id="finalFlower"></div>

  <div id="love">
    TE AMO 🩵
  </div>
</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;
let DPR=1;

function resize(){

  DPR=Math.min(window.devicePixelRatio||1,2);

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize",resize);

resize();


const intro=document.getElementById("intro");
const game=document.getElementById("game");
const enter=document.getElementById("enter");

const message=document.getElementById("message");
const messageText=document.getElementById("messageText");
const closeMessage=document.getElementById("closeMessage");

const hint=document.getElementById("hint");

const finalScreen=document.getElementById("final");
const finalFlower=document.getElementById("finalFlower");
const love=document.getElementById("love");


enter.addEventListener("click",()=>{

  intro.style.opacity="0";

  setTimeout(()=>{

    intro.style.display="none";

    game.style.display="block";

    initUniverse();

  },1000);

});


let objects=[];
let flowers=[];
let stars=[];


let camera={
  x:0,
  y:0,
  z:0,
  yaw:0,
  pitch:0
};


let velocity={
  forward:0,
  yaw:0,
  pitch:0
};


let targetForward=0;
let targetYaw=0;
let targetPitch=0;


let unlocked=0;
let messageOpen=false;
let finalStarted=false;


const messages=[

`Se que quizá esto no es lo que te esperabas pero quería darte esto de una manera un poquito más especial y ya sabes, a mi estilo.`,

`Todo esto para recordarte de que los detalles típicos, se pueden modificar con un poquito más de esfuerzo para que tenga un toque un poco más personal y no sea tan básico como regalarte un ramo sin más.`,

`Aunque quizá no te gusta tanto la idea de tener una página web en la que puedas ir viendo todo, pero tienes algo que no se irá nunca y podrás visitarlo cada vez que quieras. Pero con todo este rollo voy a la parte bonita jajajja.`,

`Marina recio, sé que no es una fecha especial ni nada por el estilo pero es mi manera de demostrarte que no hay nada en el mundo que no quiera hacer por ti, ya que para mí, lo eres todo en este mundo. Y lo que siempre te digo y cosa que no quiero que transforme en algo típico sin sentimiento es que…`

];


function initUniverse(){

  objects=[];
  flowers=[];
  stars=[];


  for(let i=0;i<1800;i++){

    stars.push({

      x:(Math.random()-.5)*3000,

      y:(Math.random()-.5)*1800,

      z:150+Math.random()*3200,

      r:.3+Math.random()*1.5,

      a:.25+Math.random()*.75,

      tw:Math.random()*Math.PI*2

    });

  }


  addPlanet(-260,-90,650,65,"#5b68d9",2);

  addPlanet(250,100,1000,90,"#d86d9b",1);

  addPlanet(-420,150,1450,115,"#d68b54",3);

  addPlanet(420,-180,1900,75,"#68b5c7",2);

  addPlanet(-100,-260,2400,135,"#7d70d6",4);

  addPlanet(520,250,3000,105,"#d89b5b",3);


  addMoon(-190,-40,560,32,"#aaa9bd");

  addMoon(300,160,880,25,"#b8b5c8");

  addMoon(-350,110,1370,38,"#aaa79c");


  addFlower(-70,35,430,1);

  addFlower(190,-80,900,2);

  addFlower(-250,-90,1550,3);

  addFlower(300,120,2250,4);


  requestAnimationFrame(loop);
}


function addPlanet(x,y,z,r,color,type){

  objects.push({

    type:"planet",

    x:x,
    y:y,
    z:z,

    r:r,

    color:color,

    typePlanet:type,

    rot:Math.random()*6

  });

}


function addMoon(x,y,z,r,color){

  objects.push({

    type:"moon",

    x:x,
    y:y,
    z:z,

    r:r,

    color:color,

    rot:Math.random()*6

  });

}


function addFlower(x,y,z,n){

  flowers.push({

    type:"flower",

    x:x,
    y:y,
    z:z,

    n:n,

    r:28,

    pulse:Math.random()*6,

    visible:false

  });

}


function project(obj){

  let dx=obj.x-camera.x;

  let dy=obj.y-camera.y;

  let dz=obj.z-camera.z;


  const cy=Math.cos(camera.yaw);

  const sy=Math.sin(camera.yaw);


  let rx=dx*cy-dz*sy;

  let rz=dx*sy+dz*cy;


  const cp=Math.cos(camera.pitch);

  const sp=Math.sin(camera.pitch);


  let ry=dy*cp-rz*sp;

  rz=dy*sp+rz*cp;


  if(rz<=15){

    return null;

  }


  const f=Math.min(W,H)*.85;


  return {

    x:W/2+(rx/rz)*f,

    y:H/2+(ry/rz)*f,

    z:rz,

    scale:f/rz

  };

}


function drawBackground(){

  const g=ctx.createRadialGradient(

    W*.5,
    H*.45,
    0,

    W*.5,
    H*.5,
    Math.max(W,H)

  );


  g.addColorStop(0,"#101344");

  g.addColorStop(.35,"#07082b");

  g.addColorStop(1,"#010208");


  ctx.fillStyle=g;

  ctx.fillRect(0,0,W,H);


  drawNebula(
    W*.2,
    H*.25,
    220,
    "rgba(90,80,255,.08)"
  );


  drawNebula(
    W*.8,
    H*.7,
    280,
    "rgba(255,70,170,.06)"
  );


  drawNebula(
    W*.55,
    H*.15,
    180,
    "rgba(60,180,255,.05)"
  );

}


function drawNebula(x,y,r,color){

  const g=ctx.createRadialGradient(
    x,
    y,
    0,
    x,
    y,
    r
  );


  g.addColorStop(0,color);

  g.addColorStop(1,"rgba(0,0,0,0)");

  ctx.fillStyle=g;

  ctx.fillRect(
    x-r,
    y-r,
    r*2,
    r*2
  );

}


function drawStars(time){

  for(const s of stars){

    const p=project(s);

    if(!p) continue;


    const tw=.65+
      .35*Math.sin(
        time*.001+s.tw
      );


    let size=s.r*p.scale*2;


    if(size<.25) size=.25;

    if(size>4) size=4;


    ctx.globalAlpha=s.a*tw;


    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      size,
      0,
      Math.PI*2
    );


    ctx.fillStyle="#fff";

    ctx.fill();

  }


  ctx.globalAlpha=1;

}


function drawPlanet(o,time){

  const p=project(o);

  if(!p) return;


  let r=o.r*p.scale;


  if(r<1) return;

  if(r>500) r=500;


  const glow=ctx.createRadialGradient(

    p.x-r*.3,
    p.y-r*.3,
    r*.05,

    p.x,
    p.y,
    r*1.5

  );


  glow.addColorStop(0,o.color);

  glow.addColorStop(.65,o.color);

  glow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );


  ctx.fillStyle=glow;

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    r*1.35,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.save();


  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    r,
    0,
    Math.PI*2
  );

  ctx.clip();


  const shade=ctx.createLinearGradient(

    p.x-r,
    p.y-r,

    p.x+r,
    p.y+r

  );


  shade.addColorStop(
    0,
    "rgba(255,255,255,.3)"
  );


  shade.addColorStop(
    .45,
    "rgba(255,255,255,.04)"
  );


  shade.addColorStop(
    1,
    "rgba(0,0,0,.65)"
  );


  ctx.fillStyle=o.color;

  ctx.fillRect(
    p.x-r,
    p.y-r,
    r*2,
    r*2
  );


  ctx.fillStyle=shade;

  ctx.fillRect(
    p.x-r,
    p.y-r,
    r*2,
    r*2
  );


  ctx.globalAlpha=.16;


  for(let i=0;i<5;i++){

    ctx.beginPath();


    ctx.ellipse(

      p.x+(i-2)*r*.35,

      p.y+
      Math.sin(i+time*.0002)*r*.3,

      r*.15,

      r*.035,

      i,

      0,

      Math.PI*2

    );


    ctx.fillStyle="#fff";

    ctx.fill();

  }


  ctx.restore();


  if(o.type==="planet" && o.r>100){

    ctx.save();


    ctx.translate(
      p.x,
      p.y
    );


    ctx.rotate(-.25);


    ctx.beginPath();


    ctx.ellipse(

      0,
      0,

      r*1.6,
      r*.38,

      0,
      0,
      Math.PI*2

    );


    ctx.strokeStyle=
      "rgba(220,220,255,.28)";


    ctx.lineWidth=
      Math.max(1,r*.08);


    ctx.stroke();


    ctx.restore();

  }

}


function drawFlower(f,time){

  const p=project(f);

  if(!p) return;


  let r=f.r*p.scale;


  if(r<3) return;

  if(r>70) r=70;


  f.visible=true;


  const pulse=
    1+
    Math.sin(
      time*.003+f.pulse
    )*.08;


  const aura=ctx.createRadialGradient(

    p.x,
    p.y,
    0,

    p.x,
    p.y,
    r*2.8

  );


  aura.addColorStop(
    0,
    "rgba(255,235,60,.42)"
  );


  aura.addColorStop(
    1,
    "rgba(255,220,40,0)"
  );


  ctx.fillStyle=aura;


  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    r*2.8,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.save();


  ctx.translate(
    p.x,
    p.y
  );


  ctx.scale(
    pulse,
    pulse
  );


  ctx.beginPath();

  ctx.moveTo(
    0,
    r*.2
  );

  ctx.lineTo(
    0,
    r*1.5
  );


  ctx.strokeStyle="#73b94b";

  ctx.lineWidth=
    Math.max(1,r*.09);

  ctx.stroke();


  for(let i=0;i<8;i++){

    const a=i*Math.PI/4;


    ctx.save();

    ctx.rotate(a);


    ctx.beginPath();


    ctx.ellipse(

      0,
      -r*.62,

      r*.28,
      r*.62,

      0,
      0,
      Math.PI*2

    );


    ctx.fillStyle="#ffe033";

    ctx.fill();


    ctx.restore();

  }


  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r*.27,
    0,
    Math.PI*2
  );


  ctx.fillStyle="#eaa900";

  ctx.fill();


  ctx.restore();


  if(f.n===unlocked+1){

    ctx.font=
      "bold "+
      Math.max(11,r*.55)+
      "px Arial";


    ctx.textAlign="center";

    ctx.fillStyle=
      "rgba(255,255,255,.9)";


    ctx.fillText(
      ""+f.n,
      p.x,
      p.y-r*1.6
    );

  }

}


let lastTime=0;


function loop(time){

  const dt=
    Math.min(
      (time-lastTime)/1000,
      .033
    );


  lastTime=time;


  velocity.forward+=
    (targetForward-velocity.forward)*.06;


  velocity.yaw+=
    (targetYaw-velocity.yaw)*.08;


  velocity.pitch+=
    (targetPitch-velocity.pitch)*.08;


  camera.z+=
    velocity.forward*
    dt*
    170;


  camera.yaw+=
    velocity.yaw*
    dt;


  camera.pitch+=
    velocity.pitch*
    dt;


  camera.z=
    Math.max(
      -100,
      Math.min(
        2850,
        camera.z
      )
    );


  drawBackground();

  drawStars(time);


  let renderObjects=[];


  for(const o of objects){

    const p=project(o);

    if(p){

      renderObjects.push({

        object:o,

        depth:p.z

      });

    }

  }


  for(const f of flowers){

    const p=project(f);

    if(p){

      renderObjects.push({

        object:f,

        depth:p.z

      });

    }

  }


  renderObjects.sort(
    (a,b)=>b.depth-a.depth
  );


  for(const item of renderObjects){

    if(
      item.object.type==="flower"
    ){

      drawFlower(
        item.object,
        time
      );

    }else{

      drawPlanet(
        item.object,
        time
      );

    }

  }


  requestAnimationFrame(loop);

}


/* =========================
   TÁCTIL
========================= */

let touches=new Map();

let lastPinch=0;

let lastTouchX=0;

let lastTouchY=0;


canvas.addEventListener(
  "touchstart",
  e=>{

    for(
      const t of e.changedTouches
    ){

      touches.set(
        t.identifier,
        {
          x:t.clientX,
          y:t.clientY
        }
      );

    }


    if(touches.size===1){

      const t=
        [...touches.values()][0];


      lastTouchX=t.x;

      lastTouchY=t.y;

    }


    if(touches.size===2){

      const arr=
        [...touches.values()];


      lastPinch=
        Math.hypot(

          arr[0].x-arr[1].x,

          arr[0].y-arr[1].y

        );


      targetForward=0;

    }

  },
  {passive:false}
);


canvas.addEventListener(
  "touchmove",
  e=>{

    e.preventDefault();


    for(
      const t of e.changedTouches
    ){

      if(
        touches.has(t.identifier)
      ){

        touches.get(
          t.identifier
        ).x=t.clientX;


        touches.get(
          t.identifier
        ).y=t.clientY;

      }

    }


    if(touches.size===1){

      const t=
        [...touches.values()][0];


      const dx=
        t.x-lastTouchX;


      const dy=
        t.y-lastTouchY;


      targetYaw+=dx*.0018;

      targetPitch+=dy*.0018;


      targetPitch=
        Math.max(
          -1.1,
          Math.min(
            1.1,
            targetPitch
          )
        );


      targetForward*=.9;


      lastTouchX=t.x;

      lastTouchY=t.y;

    }


    if(touches.size===2){

      const arr=
        [...touches.values()];


      const pinch=
        Math.hypot(

          arr[0].x-arr[1].x,

          arr[0].y-arr[1].y

        );


      const delta=
        pinch-lastPinch;


      targetForward+=
        delta*.018;


      targetForward=
        Math.max(
          -28,
          Math.min(
            28,
            targetForward
          )
        );


      lastPinch=pinch;

    }

  },
  {passive:false}
);


canvas.addEventListener(
  "touchend",
  e=>{

    for(
      const t of e.changedTouches
    ){

      touches.delete(
        t.identifier
      );

    }


    if(touches.size===0){

      targetForward*=.15;

      targetYaw*=.75;

      targetPitch*=.75;

    }

  }
);


/* =========================
   RATÓN
========================= */

let mouseDown=false;

let mouseX=0;

let mouseY=0;


canvas.addEventListener(
  "mousedown",
  e=>{

    mouseDown=true;

    mouseX=e.clientX;

    mouseY=e.clientY;

  }
);


window.addEventListener(
  "mouseup",
  ()=>{

    mouseDown=false;

  }
);


window.addEventListener(
  "mousemove",
  e=>{

    if(!mouseDown) return;


    const dx=
      e.clientX-mouseX;


    const dy=
      e.clientY-mouseY;


    targetYaw+=dx*.002;

    targetPitch+=dy*.002;


    targetPitch=
      Math.max(
        -1.1,
        Math.min(
          1.1,
          targetPitch
        )
      );


    mouseX=e.clientX;

    mouseY=e.clientY;

  }
);


canvas.addEventListener(
  "wheel",
  e=>{

    e.preventDefault();


    targetForward+=
      (-e.deltaY)*.035;


    targetForward=
      Math.max(
        -28,
        Math.min(
          28,
          targetForward
        )
      );

  },
  {passive:false}
);


/* =========================
   FLORES
========================= */

let lastTapTime=0;


function checkFlower(x,y){

  if(
    messageOpen ||
    finalStarted
  ) return;


  let closest=null;

  let closestDistance=
    Infinity;


  for(const f of flowers){

    if(
      f.n!==unlocked+1
    ) continue;


    const p=project(f);

    if(!p) continue;


    const r=
      Math.max(
        30,
        80*p.scale
      );


    const d=
      Math.hypot(
        x-p.x,
        y-p.y
      );


    if(
      d<r &&
      d<closestDistance
    ){

      closest=f;

      closestDistance=d;

    }

  }


  if(closest){

    openFlower(
      closest
    );

  }

}


canvas.addEventListener(
  "click",
  e=>{

    const rect=
      canvas.getBoundingClientRect();


    checkFlower(
      e.clientX-rect.left,
      e.clientY-rect.top
    );

  }
);


canvas.addEventListener(
  "touchend",
  e=>{

    if(touches.size!==0)
      return;


    const now=Date.now();


    if(
      now-lastTapTime<300
    )
      return;


    lastTapTime=now;


    const t=
      e.changedTouches[0];


    if(!t) return;


    const rect=
      canvas.getBoundingClientRect();


    checkFlower(
      t.clientX-rect.left,
      t.clientY-rect.top
    );

  }
);


/* =========================
   MENSAJES
========================= */

function openFlower(f){

  messageOpen=true;

  messageText.textContent=
    messages[f.n-1];


  message.style.display=
    "flex";

}


closeMessage.addEventListener(
  "click",
  ()=>{

    message.style.display=
      "none";


    messageOpen=false;


    unlocked++;


    if(unlocked>=4){

      setTimeout(
        startFinal,
        700
      );

    }

  }
);


/* =========================
   FINAL NUEVO
========================= */

function startFinal(){

  finalStarted=true;

  finalScreen.style.display="flex";


  const flower=
    finalFlower;

  const text=
    love;


  flower.style.transition=
    "none";

  flower.style.opacity="1";

  flower.style.transform=
    "scale(.08)";


  text.style.opacity="0";


  /*
    La flor empieza muy lejos.
  */

  requestAnimationFrame(()=>{

    flower.style.transition=
      "transform 9s cubic-bezier(.18,.65,.22,1), opacity 1.5s ease";


    flower.style.transform=
      "scale(1)";

  });


  /*
    Ahora nos acercamos de verdad,
    pero de forma mucho más suave.
  */

  setTimeout(()=>{

    flower.style.transition=
      "transform 4s cubic-bezier(.25,.7,.2,1)";


    flower.style.transform=
      "scale(2.2)";

  },9000);


  /*
    Llegamos a la flor y la atravesamos.
  */

  setTimeout(()=>{

    flower.style.transition=
      "transform 2.8s ease-in, opacity 2.8s ease-in";


    flower.style.transform=
      "scale(5)";


    flower.style.opacity="0";

  },13000);


  /*
    Finalmente aparece el mensaje.
  */

  setTimeout(()=>{

    text.style.opacity="1";

  },15500);

}


/* =========================
   PISTA
========================= */

setTimeout(()=>{

  hint.style.opacity="0";

},7000);

</script>
